     v1.20: Etappe D4 – Ziehen im Plan-Editor: Abgänge/Gruppen auf eine Marke „+“ oder hinter einen Abgang,
           Kontakte und Verbraucher auf einen anderen Platz (belegt: tauschen); Maus nach kurzer
           Bewegung, Finger/Pencil nach kurzem Halten (Wischen blättert weiter); Tasten ←/→ wählen
           Abgänge, Alt+←/→ verschiebt, +/− zoomt, „Tasten“ bzw. ? zeigt alle Kürzel
     v1.19: Etappe D3 – Steuerstromkreise direkt im Plan-Editor: Reiter „Steuerung“ mit der Palette,
           Plätze und Verbraucherplätze im Blatt antippen, Leiste mit Gerät ändern, Leeren, ↑/↓,
           Kopieren/Einfügen, Zweig, Pfad, Vorlage; der Raster-Bildschirm entfällt, alle Wege zu einem
           Steuerstromkreis führen in den Plan-Editor
     v1.18: Etappe D2 – Plan-Editor: Palette (Steckdose, CEE, Leuchte, Geräteanschluss, Unterverteiler,
           FI-Gruppe, Steuer-LS, Steuertrafo), Einfügemarken „+“ im Blatt, Verschieben, Kopieren,
           Ausschneiden, Einfügen, Löschen; Rückgängig/Wiederholen über das ganze Projekt (50 Schritte,
           Sitzung), Tastenkürzel
     v1.17: Etappe D1 – Plan-Editor: Blätter eines Verteilers mit Antippflächen (Einspeisung, Abgänge,
           Gruppen, Überspannungsschutz, Steuerstromkreise), Eigenschaften daneben (iPad hoch: darunter)
           mit denselben Feldern wie die Bildschirme, Zoom; „Plan bearbeiten“ auf dem Startbildschirm
           und oben im Verteiler
     v1.16: Steuertrafo als Quelle der Steuerspannung: Abgang mit Primär-LS (230 V L–N oder 400 V L1–L2),
           Trafo -T (Sekundärspannung, Leistung, 0 V geerdet oder ungeerdet) und Sekundär-LS; im
           Steuerstromkreis Leitungen „24 V“/„0 V“ (schwarz), Klemmenplan und Übersichtsschaltplan;
           Bibliothek v1.6 (Trafo einpolig aus dem EN-Baukasten)
     v1.15: Bibliothek v1.5 mit dem Steuertrafo (allpolig und einpolig; noch ohne Verwendung im Plan)
     v1.14: Etappe C4 – Vorlagen für Steuerstromkreise (im Raster „Vorlage …“, im Kreis „Vorlage einsetzen“):
           Taster parallel (Stromstoß, Treppenlicht), Selbsthaltung Ein/Aus, Selbsthaltung mit Not-Aus,
           je mit oder ohne Betriebsmeldung, Hand-0-Automatik mit Melder; Befehlsgeber-Anschlüsse je
           Gerät fortlaufend (13/14, 23/24 …); Melder beschriftet rechts vom Kontakt
     v1.13: Etappe C3 – Warnungen (zu wenige Kontakte, Schaltgerät ohne Kreis, Kreis ohne Kontakte,
           Pfad ohne Verbraucher, Stromstoß ohne Taster, Spule mehrfach, Quelle/Abgriff fehlt …);
           Feldgeräte (Einbauort „im Feld“) bei Klemmleiste über -X1 mit je zwei Klemmen je Kontakt und
           eigener Leitung -W, im Steuerstromkreis und im Klemmenplan; eigenständiges Zeitrelais -K
           (Funktion, Zeit, verzögerte Kontakte n7/n8, n5/n6) mit Kontaktspiegel; Kreise ohne Schaltgerät
     v1.12: Etappe C2b – Raster-Editor je Steuerstromkreis: Palette (Befehlsgeber, Hilfskontakte,
           Zeitrelais-Kontakte, Spule, Meldeleuchte, Radierer), Raster aus Pfaden/Zweigen × Plätzen
           und Verbraucher, Auswahl mit Werkzeugleiste (Gerät ändern, Löschen, ↑/↓, Kopieren/Einfügen,
           Zweig ab hier, Anfang/Ende des Zweigs), Rückgängig/Wiederholen (50 Schritte, Sitzung),
           Tastenkürzel; geteilte Ansicht mit Vorschau des Blatts (iPad hoch: darunter, einklappbar)
     v1.11: Etappe C2a – Eingabe der Steuerstromkreise: Bildschirm „Steuerstromkreise“ je Verteiler
           (Steuerspannung, Quelle, Klemmen; Kreise; Befehlsgeber und Meldeleuchten), Bildschirm je Kreis
           (Pfade mit 6 Plätzen und Verbraucher, Zweige, Abgriff), Steuer-LS im Abgangsbaum; der Kreis
           entsteht mit der Wahl des Schaltgeräts; Kreise ohne Schaltgerät werden nicht gezeichnet
     v1.10: Etappe C1b – Steuerspannung je Verteiler wählbar: je Abgang, gemeinsam durchgeschliffen
           oder über gebrückte Klemmen (-X1 oder eigene Leiste -X0); Quelle Abgang oder Steuer-LS
           (Abgang ohne Leitung); je Kreis eigener Abgriff möglich (Eingabe noch ohne Editor);
           im Steuerstromkreis nur die N-Leitung blau, Verbraucher bis zur Klemme/zum Abzweig schwarz
     v1.9: Etappe C1 – Blatt „Steuerstromkreis“ je Verteiler hinter seinem Stromlaufplan:
           Pfade mit 6 Kontaktplätzen und Verbraucherplatz, Zweige, Kontaktspiegel, Querverweise;
           Abgriff der Steuerspannung im Abgang; Befehlsgeber -S, Meldeleuchte -H
           (Eingabe noch ohne Editor, nur über Daten)
     v1.8: Namensnennung der QElectroTech-Schaltzeichen (CC BY 3.0) auf dem Startbildschirm
           und auf dem Deckblatt des Plans
     v1.7: Schaltgeräte je Abgang (Schütz, Stromstoßschalter, Zeitrelais) mit Kennzeichen -Q bzw. -K,
           N mitschalten, Ausstattung an Hilfskontakten; Hauptkontakte im Stromlaufplan,
           Schützzeichen im Übersichtsschaltplan, Herkunft im Klemmenplan, Zusatz im Türzettel
     v1.6: Bibliothek v1.4 mit den Zeichen für Steuerstromkreise (noch ohne Verwendung im Plan)
     v1.5: Klemmenplan der Klemmleiste -X1 je Verteiler (Tabelle mit Aderfarben br/sw/gr/bl/gnge)
           hinter den Stromlaufplänen, abschaltbar; N-Klemme je Verteiler wählbar
           (N-Trennklemme oder normale N-Klemme), auch im Stromlaufplan gezeichnet
     v1.4: Endklemmen (Geräteanschlussdose) und offene Enden schließen genau mit der
           Unterkante der Steckdosen ab, im Stromlaufplan und im Übersichtsschaltplan
     v1.3: Übersichtsschaltplan (einpolig) je Verteiler hinter dem Inhaltsverzeichnis,
           abschaltbar in den Projektdaten; einpolige Zeichen aus der Bibliothek v1.3
     v1.2: Deckblatt (Blatt 1) und Inhaltsverzeichnis (Blatt 2) vor den Planblättern,
           abschaltbar in den Projektdaten; Planblätter beginnen dann mit Blatt 3
     v1.1: Türzettel (Sicherungsübersicht) je Verteiler, A4 hoch, zum Ausdrucken
     v1.0: alle Linien in Leiterstärke (auch Sammelschienen und deren Querverweise);
           Verbindungspunkte überall, wo drei oder mehr Linien zusammentreffen
     v0.9: Untersammelschienen in Leiterstärke (0,25 mm); nur die Hauptsammelschienen bleiben 0,5 mm
     v0.8: Endklemmen der Anschlussdose auf Höhe der übrigen Abgangsenden
     v0.7: Anschluss auch als Geräteanschlussdose (Endklemmen, -X2 …) und als
           Leuchte (Lampenzeichen, -E1 …); Bibliothek v1.2
     v0.6: alle Abgänge enden ganz unten auf einer Höhe; Überspannungsschutz:
           PE-Seite der Ableiter grün
     v0.5: Schriftfeld als 20 mm hoher Streifen über die ganze Blattbreite
     v0.4: Plan: keine Leiter mehr übereinander in Gruppen (N/PE werden rechts
           neben dem Gruppengerät zugeführt), Untersammelschienen nur von der
           ersten bis zur letzten Verbindung, Abgänge einer Reihe enden auf
           gleicher Höhe (auch feste Anschlüsse)
     v0.3: Etappe 4a – Generator: Bildschirm „Plan“ mit allen Blättern, Format A4/A3
           (A4 voreingestellt), Druck/PDF aller Blätter; Einspeisungsblatt bzw.
           kurze Einspeisung auf dem ersten Abgangsblatt, Abgänge, Gruppen mit
           Untersammelschiene, Querverweise, Blattnummern durchgehend
     v0.2: Abgangsklemmen je Verteiler wählbar (Klemmleiste / ohne, neu: ohne),
           je Abgang als Option abweichend (mit / ohne Klemmen)
     Bedienung wie im SF E-Plan: eigene Bildschirme, ein Feld je Fenster,
     sofort gespeichert, Zurück-Pfeil genügt.
     Gerätekennungen = Kennungen der Bibliothek v1.1. -->
<style>
:root{--grund:#f4f4f6;--flaeche:#e5e5ea;--karte:#fff;--karte2:#f8f8fa;--hover:#eeeef2;--tinte:#1b1c21;--leise:#5d6070;--linie:#e1e1e7;--linie2:#c6c7d0;
  --akzent:#6a35e8;--akzent-hell:#efe9fd;--akzent-tief:#4a1fb8;--auf-akzent:#fff;--warn:#a85a00;--warn-hell:#fff3df;--rot:#b42318;--rot-hell:#ff9a8f;
  --dunkel:#1f2026;--kopfglas:rgba(244,244,246,.92);--schleier:rgba(16,16,22,.38);--n:#1f5fd6;--pe:#1a8a3a;--ov:#6a35e8}
/* Designsystem (ab v1.23): Oberfläche in Graphit, Signalfarbe Violett für Auswahl, Werkzeuge und Hilfen –
   bewusst getrennt vom N-Leiter (blau) und PE (grün) des Plans; dunkler Modus nur für die Oberfläche,
   Planblatt und Türzettel bleiben weiß */
@media (prefers-color-scheme:dark){:root{--grund:#141519;--flaeche:#0d0e11;--karte:#1d1e24;--karte2:#23242b;--hover:#2a2b33;--tinte:#ebebf0;--leise:#a3a6b4;
  --linie:#30323b;--linie2:#474a58;--akzent:#a988ff;--akzent-hell:#2b2340;--akzent-tief:#c9b3ff;--auf-akzent:#15161a;--warn:#f0a640;--warn-hell:#3a2a12;--rot:#ff8a7a;
  --rot-hell:#ff9a8f;--dunkel:#2c2d36;--kopfglas:rgba(20,21,25,.9);--schleier:rgba(0,0,0,.55);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--grund);color:var(--tinte);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.kopf{position:sticky;top:0;z-index:5;background:var(--kopfglas);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--linie);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;min-height:52px}
.kopf h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.kopf .seite{width:72px;display:flex}
.kopf .seite.r{justify-content:flex-end}
.zurueck{border:0;background:none;color:var(--akzent);font-size:17px;padding:6px 4px;cursor:pointer;display:flex;align-items:center;gap:2px}
.zurueck svg{width:20px;height:20px}
.kopfknopf{border:0;background:none;color:var(--akzent);font-size:15px;padding:6px 4px;cursor:pointer}
.kopfknopf[aria-pressed="true"]{font-weight:700}
main{max-width:760px;margin:0 auto;padding:12px 16px 60px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--leise);margin:22px 4px 8px;font-weight:600}
.liste{background:var(--karte);border:1px solid var(--linie);border-radius:12px;overflow:hidden}
.zeile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:11px 14px;min-height:48px;border-top:1px solid var(--linie);cursor:pointer}
.zeile:first-child{border-top:0}
.zeile:active{background:var(--hover)}
.zeile .t{flex:1;min-width:0}
.zeile .ob{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .un{display:block;font-size:13px;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .w{color:var(--leise);text-align:right;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .pfeil{color:var(--linie2);flex:0 0 auto}
.zeile.einr{padding-left:34px;position:relative}
.zeile.einr::before{content:"";position:absolute;left:20px;top:0;bottom:0;border-left:2px solid var(--linie2)}
.bmk{display:inline-block;min-width:44px;font:600 13px ui-monospace,Menlo,Consolas,monospace;color:var(--tinte);background:var(--hover);border-radius:6px;padding:2px 6px;text-align:center;flex:0 0 auto}
.bmk.hand{background:var(--warn-hell);color:var(--warn)}
.leise{color:var(--leise)}
.neu{display:block;width:100%;border:1.5px dashed var(--linie2);background:none;border-radius:10px;padding:10px;margin-top:8px;color:var(--leise);font-size:15px;cursor:pointer}
.neu.inliste{border:0;border-top:1px dashed var(--linie2);border-radius:0;margin:0;text-align:left;padding:11px 14px}
.neu.inliste.einr{padding-left:34px}
.gefahr{color:var(--rot)}
.hinweis{font-size:13.5px;color:var(--leise);margin:6px 4px}
.hinweis.lizenz{font-size:12px}
.hinweis.lizenz a{color:inherit}
.warnung{font-size:13.5px;color:var(--warn);margin:6px 4px}
.wahl.mitklein button{flex-direction:column;align-items:stretch;gap:2px}
.wahl.mitklein button>span{white-space:nowrap}
.wahl.mitklein button small{white-space:normal;line-height:1.3}
.fenster.mitklein{min-width:min(360px, calc(100vw - 24px))}
.fenster.mitklein:not(.pop){max-height:calc(100dvh - 24px);display:flex;flex-direction:column}.fenster.mitklein:not(.pop) .inhalt{overflow-y:auto;min-height:0}
.abhilfe{display:block;color:var(--tinte);font-size:13px;margin-top:2px}      /* ab v1.58 (C29): zweite Zeile „So beheben: …“ */
.feldfehler{color:var(--rot);font-size:13px;margin:6px 2px 0}.zeile .un.feldfehler{color:var(--rot);white-space:normal;overflow:visible}.feldfehler[hidden]{display:none !important}input.fehler{border-color:var(--rot) !important;outline-color:var(--rot)}
.feldfehler.feldwarn,.zeile .un.feldfehler.feldwarn{color:var(--warn)}input.warn{border-color:var(--warn) !important;outline-color:var(--warn)}
.sort{display:flex;gap:4px;flex:0 0 auto}
.sort button{border:1px solid var(--linie);background:var(--karte);border-radius:8px;width:36px;height:32px;cursor:pointer;color:var(--akzent)}
.sort button:disabled{opacity:.3}
table.ueb{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--karte);border:1px solid var(--linie);border-radius:12px;overflow:hidden}
table.ueb th{text-align:left;font-weight:600;color:var(--leise);font-size:12px;padding:8px;border-bottom:1px solid var(--linie);background:var(--karte2)}
table.ueb td{padding:7px 8px;border-top:1px solid var(--linie);vertical-align:top}
table.ueb td.m{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
table.ueb tr.gr td{background:var(--karte2);font-weight:600}
.tabwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ph{display:inline-block;font:600 12px ui-monospace,Menlo,monospace;padding:1px 5px;border-radius:5px;background:var(--hover)}
.ph.auto{background:var(--akzent-hell);color:var(--akzent)}
/* Fenster */
.schleier{position:fixed;inset:0;background:var(--schleier);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.schleier .mitte{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px 14px}
.fenster{background:var(--karte);border-radius:14px;width:100%;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.fenster h3{margin:0;padding:14px 16px 6px;font-size:16px}
.fenster .inhalt{padding:4px 16px 12px}
.fenster .fuss{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--linie)}
.fenster input[type=text],.fenster input[type=number],.fenster input[type=date]{width:100%;font:inherit;font-size:17px;padding:9px 10px;border:1px solid var(--linie);border-radius:9px;background:var(--karte2)}
.wahl{display:flex;flex-direction:column;border:1px solid var(--linie);border-radius:10px;overflow:hidden;max-height:60vh;overflow-y:auto}
.wahl button{border:0;border-top:1px solid var(--linie);background:var(--karte);text-align:left;padding:11px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.wahl button:first-child{border-top:0}
.wahl button[aria-checked="true"]{background:var(--akzent-hell);color:var(--akzent);font-weight:600}
.wahl button small{color:var(--leise);font-weight:400}
.knopf{border:0;background:var(--akzent);color:var(--auf-akzent);border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}
.knopf.zweit{background:var(--karte);color:var(--akzent);border:1px solid var(--akzent)}

.fenster .text{font-size:15px;color:var(--leise);margin:0 0 8px}

.blattkarte{background:var(--flaeche);border-radius:12px;padding:10px;margin-bottom:14px}

.blattkarte svg{display:block;width:100%;height:auto;background:var(--karte);box-shadow:0 2px 8px rgba(0,0,0,.18)}

.tz{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;padding:14mm 12mm;box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:4px;margin-bottom:16px}
.tz h1{font-size:22pt;margin:0 0 2pt}
.tz .tzu{font-size:10.5pt;color:#333;margin-bottom:10pt}

.tz th{text-align:left;font-size:9pt;color:#333;border-bottom:1.2pt solid #000;padding:3pt 4pt}

.tz tr.tzkopf td{background:#eee}
.tz tr.gruppe td{background:#f3f3f3;font-weight:700;border-bottom:.8pt solid #000}

.tz .fuss{font-size:8.5pt;color:#555;margin-top:8pt}

/* Startbildschirm (ab v1.21) */
main.start{max-width:1040px}

.abschnitt .kopfknopf{margin:0 4px 6px}

.meldung .mknopf{margin-left:10px;border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 4px}
/* Sammeländerung (ab v1.56): Abgänge mit Kontrollkästchen */
.sammelzeile{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:44px;border-top:1px solid var(--linie);cursor:pointer}
.sammelzeile:first-child{border-top:0}
.sammelzeile.einr{padding-left:34px}
.sammelzeile input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--akzent);margin:0}
.sammelzeile .t{flex:1 1 auto;min-width:0}
.sammelzeile .un{display:block;font-size:13px;color:var(--leise)}
/* Fenster am angetippten Feld (ab v1.21) */
.schleier.pop{background:transparent;overflow:hidden}
.fenster.pop{position:fixed;max-width:none;border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.07);display:flex;flex-direction:column}
.fenster.pop h3{font-size:12px;font-weight:650;color:var(--leise);text-transform:uppercase;letter-spacing:.06em;padding:11px 14px 4px}
.fenster.pop .inhalt{overflow-y:auto;padding:2px 6px 6px;min-height:0;-webkit-overflow-scrolling:touch}
.fenster.pop .text{padding:0 8px;font-size:13.5px}
.fenster.pop .wahl{max-height:none;border:0;border-radius:0;gap:1px}
.fenster.pop .wahl button{border-top:0;border-radius:8px;padding:9px 10px}
.wahl button:hover{background:var(--hover)}
.wahl button[aria-checked="true"]:hover{background:var(--akzent-hell)}
.wahl.raster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;border:0;max-height:none}
.wahl.raster button{border:1px solid var(--linie);border-radius:9px;justify-content:center;padding:11px 4px;font-variant-numeric:tabular-nums}
.fenster.pop .wahl.raster button{border:1px solid var(--linie)}
.wahl.raster button[aria-checked="true"]{border-color:var(--akzent);background:var(--akzent-hell);color:var(--akzent);font-weight:650}
.wahl .trennlinie{height:1px;background:var(--linie);margin:5px 8px}
.wahl button.an{color:var(--akzent);font-weight:650}
.wahl button.gefahr{color:var(--rot)}
.menue button{flex-direction:column;justify-content:center;gap:0}
.menue button small{font-size:12.5px}
.kacheln{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px}
.anzahlzeile{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:8px 6px 2px;border-top:1px solid var(--linie);margin-top:4px;font-size:14px}
.anzahl{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
/* Text direkt in der Zeile */
.zeile.bearbeiten{cursor:default;background:var(--akzent-hell);flex-wrap:wrap}
.zeile.bearbeiten .t{flex:1 1 140px}
.zeile.bearbeiten input{flex:2 1 180px;min-width:0;font:inherit;padding:8px 10px;border:1.5px solid var(--akzent);border-radius:9px;background:var(--karte);outline:none}
.knopf.klein{padding:5px 12px;font-size:13.5px;border-radius:8px}
:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
/* ---- Plan-Editor (ab v1.21): Arbeitsfläche über den ganzen Bildschirm ---- */
body.imeditor{overflow:hidden;background:var(--flaeche)}
.ed{position:fixed;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"kopf kopf kopf" "pal flaeche eigen" "pal fuss eigen";background:var(--flaeche)}
.edkopf{grid-area:kopf;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:var(--karte);border-bottom:1px solid var(--linie);min-height:58px;z-index:4}
.edkopf .sep,.kontext .sep{width:1px;height:24px;background:var(--linie);margin:0 4px;flex:0 0 auto}
.ikon{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:42px;height:42px;padding:0 9px;border:0;border-radius:10px;background:none;color:var(--tinte);cursor:pointer;flex:0 0 auto;font-size:14.5px}

.ikon.rot{color:var(--rot)}
.vwahl{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;border:0;background:none;padding:2px 10px;height:46px;border-radius:10px;cursor:pointer;min-width:0;max-width:260px;text-align:left}
.vwahl:hover{background:var(--hover)}
.vw-pj{font-size:11.5px;color:var(--leise);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-name{font-size:16.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.segment{display:inline-flex;background:var(--grund);border:1px solid var(--linie);border-radius:11px;padding:3px;margin-left:10px;flex:0 0 auto}
.segment button{border:0;background:none;padding:7px 16px;border-radius:8px;font-size:14.5px;font-weight:600;color:var(--leise);cursor:pointer;min-height:36px}
.segment button[aria-selected="true"]{background:var(--karte);color:var(--tinte);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.luecke{flex:1}
.edpal{grid-area:pal;width:calc(104px + env(safe-area-inset-left, 0px));overflow-y:auto;overscroll-behavior:contain;background:var(--karte);border-right:1px solid var(--linie);padding:6px 6px 20px;z-index:2}
.palgruppe{margin-bottom:8px}
.paltitel{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--leise);margin:8px 4px 4px}
.palkacheln{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.palleer{font-size:12.5px;color:var(--leise);padding:8px 6px;line-height:1.35}
.pallink{border:0;background:none;color:var(--akzent);font-size:13px;padding:8px 4px;cursor:pointer;text-align:left}
.werkzeug{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;min-height:62px;padding:6px 4px;border:1.5px solid transparent;border-radius:10px;background:none;
  cursor:pointer;font-size:11.5px;line-height:1.15;text-align:center;color:var(--tinte);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;position:relative}
.werkzeug:hover{background:var(--hover)}
.werkzeug svg{width:32px;height:32px;flex:0 0 auto}
.werkzeug[aria-pressed="true"]{background:var(--akzent-hell);border-color:var(--akzent);color:var(--akzent);font-weight:650}
.wzusatz{position:absolute;top:5px;right:6px;font:700 10px/1 system-ui,sans-serif;background:var(--tinte);color:var(--karte);border-radius:5px;padding:3px 4px}
.edflaeche{grid-area:flaeche;overflow:auto;position:relative;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.blaetter{position:relative;padding:18px 20px 48px;width:max-content;min-width:100%}
.blatt{margin:0 auto 26px}
.blatt .bt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--leise);margin:0 2px 6px}
.blatt svg{display:block;background:var(--karte);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.10),0 8px 24px rgba(0,0,0,.08)}
.ed svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ed rect.ziel{cursor:pointer;outline:none}
@media (hover:hover){.ed rect.ziel:hover{fill:rgba(106,53,232,.07)}}
.ed rect.ziel[data-sel]{fill:rgba(106,53,232,.12);stroke:var(--ov);stroke-width:.7}
.ed rect.teil{pointer-events:none}
.ed .nadel{pointer-events:none}
.blatt .btr{display:flex;align-items:center;gap:10px}
.festknopf{border:1px solid var(--linie2);background:var(--karte);color:var(--leise);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer}
.festknopf:hover{color:var(--akzent);border-color:var(--akzent)}
.festknopf.an{background:var(--akzent-hell);color:var(--akzent);border-color:var(--akzent)}
.ed .auswahlrahmen{fill:rgba(106,53,232,.06);stroke:var(--ov);stroke-width:.3;pointer-events:none}
.ed .auswahlrahmen.schneidet{stroke-dasharray:1.2 .8}
.ed [data-zusatz]{pointer-events:none}
.ed rect.ziel[data-hover],.ed rect.teil[data-aktiv][data-hover]{fill:rgba(106,53,232,.10)}
.ed .marke[data-hover] circle:not(.treffer){fill:var(--ov)}
.lupe{position:fixed;z-index:41;width:140px;height:140px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid var(--ov);box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:none}
.lupe svg{display:block;width:100%;height:100%}

.lupe.planlupe{inset:0;width:auto;height:auto;border-radius:0;border:0;box-shadow:none;pointer-events:auto;display:flex;flex-direction:column;background:var(--flaeche);z-index:35}

.planlupe .lupetitel{flex:1;min-width:0;font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.planlupe .lupezoom{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--leise);padding:0 6px}
.planlupe .lupeflaeche{flex:1;min-height:0;overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.planlupe .lupeinnen{padding:12px;width:max-content;margin:0 auto}
.planlupe .lupeinnen svg{display:block;width:100%;height:auto;background:var(--karte);box-shadow:0 1px 2px rgba(0,0,0,.1),0 8px 24px rgba(0,0,0,.08)}
.planlupe .lupefuss{padding:6px 12px calc(env(safe-area-inset-bottom) + 6px);font-size:12.5px;color:var(--leise);text-align:center;background:var(--karte);border-top:1px solid var(--linie)}
.blattkarte svg{cursor:zoom-in}
.ed .zvorschau{pointer-events:none}
.ed .zvorschau line{stroke:var(--ov);stroke-width:.35;stroke-dasharray:1 .7}

.ed.zeichnen svg{cursor:crosshair}
.ed.zeichnen rect.ziel,.ed.zeichnen .marke{pointer-events:none}
.ed .zleiter{cursor:pointer}
.ed .zhinweis{pointer-events:none}
.ed line.leiterziel{stroke:transparent;stroke-width:2.2;pointer-events:none;cursor:pointer}
.ed line.leiterziel[data-aktiv]{pointer-events:stroke}
@media (hover:hover){.ed line.leiterziel[data-aktiv]:hover{stroke:rgba(106,53,232,.18)}}
.ed .netzhalo line{stroke:rgba(106,53,232,.22);stroke-width:1.6;stroke-linecap:round}
.ed .netzhalo line.gewaehlt{stroke:rgba(106,53,232,.45)}
.ed .hilfslinie{stroke:var(--ov);stroke-width:.2;stroke-dasharray:1 .8;pointer-events:none}
.pruefknopf{border:0;background:var(--warn-hell);color:var(--warn);font-weight:700;border-radius:9px;padding:7px 11px;cursor:pointer;flex:0 0 auto}
.ed .spaltenvorschau{fill:rgba(106,53,232,.10);stroke:var(--ov);stroke-width:.35;stroke-dasharray:1.2 .8;pointer-events:none}
.ed rect.teil[data-aktiv]{pointer-events:auto;stroke:var(--ov);stroke-width:.2;stroke-dasharray:.8 .6;fill:rgba(106,53,232,.04)}
@media (hover:hover){.ed rect.teil[data-aktiv]:hover{fill:rgba(106,53,232,.12)}}
.ed rect.teil[data-sel]{fill:rgba(106,53,232,.16);stroke:var(--ov);stroke-width:.45;stroke-dasharray:none}
.ed rect.ziel:focus-visible{stroke:var(--ov);stroke-width:.5;stroke-dasharray:1.4 .9}
.ed .marke{cursor:pointer;outline:none}
/* ab v1.53: Marken wachsen am Bildschirm mit – Trefferkreis mindestens 44 px, Zeichen bis 28 px (--mkt/--mks aus zoomAnwenden) */
.ed .marke .treffer{transform:scale(var(--mkt,1));transform-box:fill-box;transform-origin:center}
.ed .marke circle:not(.treffer),.ed .marke line{transform:scale(var(--mks,1));transform-box:fill-box;transform-origin:center}
.ed .marke circle:not(.treffer){transition:fill .12s}
.ed.einfuegen .marke circle:not(.treffer),.ed .marke:focus-visible circle:not(.treffer){fill:var(--ov)}
.ed.einfuegen .marke line,.ed .marke:focus-visible line{stroke:#fff}

.ed .marke circle:not(.treffer),.ed .marke line{opacity:.35;transition:opacity .12s,fill .12s}
.ed .marke.nah circle,.ed .marke.nah line,.ed.einfuegen .marke circle,.ed.einfuegen .marke line,.ed .marke[data-hover] circle,.ed .marke[data-hover] line,
.ed .marke[data-ueber] circle,.ed .marke[data-ueber] line,.ed .marke:focus-visible circle,.ed .marke:focus-visible line,
.ed .marke[data-ziel^="leer:"] circle,.ed .marke[data-ziel^="leer:"] line{opacity:1}

.ed[data-reiter="st"] .marke,.ed[data-reiter="ze"] .marke{display:none}
.ed.ziehen rect.ziel{cursor:grabbing}
.ed.leertaste .edflaeche,.ed.leertaste .edflaeche *{cursor:grab !important}.ed.schwenkt .edflaeche,.ed.schwenkt .edflaeche *{cursor:grabbing !important}
.ed rect.ziel.quelle{fill:rgba(255,255,255,.6)}
.ed .einfuegelinie{stroke:var(--ov);stroke-width:.7;stroke-linecap:round;pointer-events:none}
.ed [data-ueber]{fill:rgba(106,53,232,.24)}
.ed g.marke[data-ueber] circle:not(.treffer){fill:#4a1fb8}
.kontext{position:absolute;z-index:3;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1px;padding:4px;background:var(--dunkel);color:#fff;border-radius:13px;box-shadow:0 8px 22px rgba(0,0,0,.28)}

.kopf{padding-left:max(12px, env(safe-area-inset-left));padding-right:max(12px, env(safe-area-inset-right))}

.ed.finger [data-ueber]{fill:rgba(106,53,232,.38);stroke:var(--ov);stroke-width:.8}
.ed.finger rect.ziel[data-ueber]{transform:scale(1.18);transform-box:fill-box;transform-origin:center}

}

function nameFenster(titel, text, vorschlag, platz, knopfText, fertigF) {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();     // Eingabe trifft nicht mehr die Karte dahinter
  const i = h('input', { type: 'text', value: vorschlag || '', placeholder: platz || '', autocapitalize: 'sentences', enterkeyhint: 'done', 'aria-label': text });
  const hw = h('p', { class: 'feldfehler', 'aria-live': 'polite', hidden: true }, 'Bitte einen Namen eingeben.');
  let an = null;
  const los = s => { const n = i.value.trim(); if (!n) { i.focus(); return; } s(false); fertigF(n); };
  const schl = fenster(titel, [h('p', { class: 'text' }, text), i, hw], s => [
    h('button', { class: 'knopf zweit', on: { click: () => s(false) } }, 'Abbrechen'),
    an = h('button', { class: 'knopf', on: { click: () => los(s) } }, knopfText)]);
  const pruef = () => { const leer = !i.value.trim(); an.disabled = leer; hw.hidden = !leer; };
  i.addEventListener('input', pruef);
  i.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); los(schl); } });
  pruef(); i.focus(); i.select();
  requestAnimationFrame(() => { if (document.activeElement !== i && i.isConnected) { i.focus(); i.select(); } });
}

// Meldung unten; ab v1.56 wahlweise mit Knopf [Text, Aktion] (steht dann länger und ist antippbar)

  if (knopf) m.append(h('button', { class: 'mknopf', on: { click: () => { clearTimeout(meldung.t); m.classList.remove('an', 'mitknopf'); knopf[1](); } } }, knopf[0]));

// Lage der Meldung im Editor unter 1000 px (ab v1.58, C13): nie über Kontextleiste, Werkzeugband, Fußleiste oder Fach –
// liegen Leiste bzw. Band in der oberen Hälfte der Fläche, steht die Meldung unten (über Fußleiste bzw. Fach), sonst oben
function meldungLage() {
  const m = document.getElementById('meldung'); m.style.top = m.style.bottom = '';
  if (!ED || !ED.ed.isConnected || !schmal()) return;
  const F = ED.flaeche.getBoundingClientRect(), mitte = F.top + F.height / 2;
  const im = [ED.blaetter.querySelector('.kontext'), ED.band && !ED.band.hidden ? ED.band : null].filter(Boolean).map(x => x.getBoundingClientRect()).filter(r => r.height);
  const ob = im.some(r => r.top + r.height / 2 < mitte);
  const fach = ED.eigen.getBoundingClientRect(), fuss = ED.fuss.getBoundingClientRect();
  const grenze = Math.min(fuss.top, ED.fach && ED.fach !== 'zu' ? fach.top : innerHeight);
  if (ob) { m.style.bottom = Math.round(innerHeight - grenze + 8) + 'px'; m.style.top = 'auto'; }
  else { const k = Math.max(ED.pal.getBoundingClientRect().bottom, ED.ed.querySelector('.edkopf').getBoundingClientRect().bottom, F.top);
    const unten = im.length ? Math.min(...im.map(r => r.top)) : innerHeight;
    m.style.top = Math.round(k + 8) + 'px'; m.style.bottom = 'auto';
    // reicht der Platz über der Leiste nicht, unten über Fußleiste bzw. Fach
    if (k + 8 + m.offsetHeight > unten - 4) { m.style.top = 'auto'; m.style.bottom = Math.round(innerHeight - grenze + 8) + 'px'; } }
}
