         (-Q Hauptschalter, -F Schutzorgane, -P Zähler, -X Klemmen,

       - Planansicht vorerst als Liste; Zeichnen kommt mit Etappe 4

           einer Schiene wandert die Abzweigstelle samt Verbindungspunkt; „Automatik anwenden“ je Leiter
     v1.26: Etappe F3 – Anordnen II: Geräte (Schutzorgan, Schaltgerät, Klemmen, Anschluss, Gruppengerät,
           Überspannungsschutz, Geräte der Einspeisung) frei im 2,5-mm-Raster ziehen oder mit den Pfeiltasten
           verschieben; Leiter folgen gerade oder mit gestaffeltem Knick; Hilfslinien beim Ziehen; Prüfliste
           (Schriftfeld, Rahmen, Überdeckung, Leiter durch Gerät); Pencil zieht sofort, der Finger nach Halten
     v1.25: Etappe F2 – Anordnen I: Abgang bzw. Gruppe in eine freie Spalte ziehen oder mit ⇤/⇥ verschieben (Lücke
           davor, die Nachbarn rücken nach), „Neues Blatt ab hier“, Stecknadel an Teilen mit Vorgaben von Hand,
           „Automatik anwenden“ je Abgang und für den ganzen Verteiler; Projektfassung 2 mit v.layout
     v1.24: Etappe F1 – Szene: der Generator schreibt je Blatt mit, welche Geräte (mit Anschlüssen, Kennzeichen,
           Beschriftung) und Leiter entstehen (Plan bitgleich); im Editor sind die Geräte eines gewählten Abgangs
           bzw. der Einspeisung einzeln antippbar (erst Abgang, dann Gerät; Esc zurück zum Abgang)
     v1.23: Etappe F0 – Fundament fürs freie Zeichnen: Zeichen-Cache im Generator (Plan rund 3–4× schneller), der
           Editor erzeugt nur die Blätter des offenen Verteilers; Prüfung der Projektfassung beim Öffnen einer Datei;
           Designsystem mit Farbtokens, Oberfläche in Graphit, Signalfarbe Violett (getrennt vom blauen N-Leiter),
           dunkler Modus für die Oberfläche (Blätter bleiben weiß)
     v1.22: Auswahl kurzer Werte (Nennstrom, Kennlinie, Querschnitt …) als Raster zum schnellen Antippen;
           Feinschliff der Palette und der schmalen Kopfleiste
     v1.21: Neue Arbeitsfläche – Plan-Editor über den ganzen Bildschirm: Kopfleiste (Projektübersicht,
           Verteiler wechseln/anlegen, Abgänge/Steuerung, benanntes Rückgängig, Drucken, Menü), Palette links
           mit Gruppen und eigenen Bildzeichen (iPad hoch: Streifen), Eigenschaften rechts in voller Höhe
           (einklappbar; iPad hoch: Fach von unten), Fußleiste mit Blattwahl, Hinweis und Zoom (100 % =
           Blattbreite, Zwei-Finger-Zoom, Strg+Mausrad); Ausschnitt bleibt beim Ändern stehen; Marken „+“
           immer sichtbar mit Einfügemenü und Anzahl; Kontextleiste am gewählten Teil (verschieben,
           duplizieren, kopieren, ausschneiden, löschen; Platz: Gerät, ↑/↓, Zweig …); alle Bildschirme
           (Einspeisung, Geräte, Steuerung, Befehlsgeber, Projekt – Schriftfeld antippen) erscheinen in der
           Eigenschaften-Leiste; Auswahllisten am angetippten Feld, Text direkt in der Zeile; Esc schließt;
           Teile mit Tab erreichbar; Startbildschirm mit Verteilerkarten (ein Tippen öffnet den Plan)
     v1.20.1: Ausschneiden und Einfügen verschiebt das Teil samt Steuerstromkreis (Kennungen bleiben);
           Kopieren legt auch die Steuerstromkreise der Schaltgeräte mit neuen Befehlsgebern an
     v1.20: Etappe D4 – Ziehen im Plan-Editor: Abgänge/Gruppen auf eine Marke „+“ oder hinter einen Abgang,
           Kontakte und Verbraucher auf einen anderen Platz (belegt: tauschen); Maus nach kurzer
           Bewegung, Finger/Pencil nach kurzem Halten (Wischen blättert weiter); Tasten ←/→ wählen
           Abgänge, Alt+←/→ verschiebt, +/− zoomt, „Tasten“ bzw. ? zeigt alle Kürzel
     v1.19: Etappe D3 – Steuerstromkreise direkt im Plan-Editor: Reiter „Steuerung“ mit der Palette,
           Plätze und Verbraucherplätze im Blatt antippen, Leiste mit Gerät ändern, Leeren, ↑/↓,
           Kopieren/Einfügen, Zweig, Pfad, Vorlage; der Raster-Bildschirm entfällt, alle Wege zu einem
           Steuerstromkreis führen in den Plan-Editor
     v1.18: Etappe D2 – Plan-Editor: Palette (Steckdose, CEE, Leuchte, Geräteanschluss, Unterverteiler,
           FI-Gruppe, Steuer-LS, Steuertrafo), Einfügemarken „+“ im Blatt, Verschieben, Kopieren,
           Ausschneiden, Einfügen, Löschen; Rückgängig/Wiederholen über das ganze Projekt (50 Schritte,
           Sitzung), Tastenkürzel
     v1.17: Etappe D1 – Plan-Editor: Blätter eines Verteilers mit Antippflächen (Einspeisung, Abgänge,
           Gruppen, Überspannungsschutz, Steuerstromkreise), Eigenschaften daneben (iPad hoch: darunter)
           mit denselben Feldern wie die Bildschirme, Zoom; „Plan bearbeiten“ auf dem Startbildschirm
           und oben im Verteiler
     v1.16: Steuertrafo als Quelle der Steuerspannung: Abgang mit Primär-LS (230 V L–N oder 400 V L1–L2),
           Trafo -T (Sekundärspannung, Leistung, 0 V geerdet oder ungeerdet) und Sekundär-LS; im
           Steuerstromkreis Leitungen „24 V“/„0 V“ (schwarz), Klemmenplan und Übersichtsschaltplan;
           Bibliothek v1.6 (Trafo einpolig aus dem EN-Baukasten)
     v1.15: Bibliothek v1.5 mit dem Steuertrafo (allpolig und einpolig; noch ohne Verwendung im Plan)
     v1.14: Etappe C4 – Vorlagen für Steuerstromkreise (im Raster „Vorlage …“, im Kreis „Vorlage einsetzen“):
           Taster parallel (Stromstoß, Treppenlicht), Selbsthaltung Ein/Aus, Selbsthaltung mit Not-Aus,
           je mit oder ohne Betriebsmeldung, Hand-0-Automatik mit Melder; Befehlsgeber-Anschlüsse je
           Gerät fortlaufend (13/14, 23/24 …); Melder beschriftet rechts vom Kontakt
     v1.13: Etappe C3 – Warnungen (zu wenige Kontakte, Schaltgerät ohne Kreis, Kreis ohne Kontakte,
           Pfad ohne Verbraucher, Stromstoß ohne Taster, Spule mehrfach, Quelle/Abgriff fehlt …);
           Feldgeräte (Einbauort „im Feld“) bei Klemmleiste über -X1 mit je zwei Klemmen je Kontakt und
           eigener Leitung -W, im Steuerstromkreis und im Klemmenplan; eigenständiges Zeitrelais -K
           (Funktion, Zeit, verzögerte Kontakte n7/n8, n5/n6) mit Kontaktspiegel; Kreise ohne Schaltgerät
     v1.12: Etappe C2b – Raster-Editor je Steuerstromkreis: Palette (Befehlsgeber, Hilfskontakte,
           Zeitrelais-Kontakte, Spule, Meldeleuchte, Radierer), Raster aus Pfaden/Zweigen × Plätzen
           und Verbraucher, Auswahl mit Werkzeugleiste (Gerät ändern, Löschen, ↑/↓, Kopieren/Einfügen,
           Zweig ab hier, Anfang/Ende des Zweigs), Rückgängig/Wiederholen (50 Schritte, Sitzung),
           Tastenkürzel; geteilte Ansicht mit Vorschau des Blatts (iPad hoch: darunter, einklappbar)
     v1.11: Etappe C2a – Eingabe der Steuerstromkreise: Bildschirm „Steuerstromkreise“ je Verteiler
           (Steuerspannung, Quelle, Klemmen; Kreise; Befehlsgeber und Meldeleuchten), Bildschirm je Kreis
           (Pfade mit 6 Plätzen und Verbraucher, Zweige, Abgriff), Steuer-LS im Abgangsbaum; der Kreis
           entsteht mit der Wahl des Schaltgeräts; Kreise ohne Schaltgerät werden nicht gezeichnet
     v1.10: Etappe C1b – Steuerspannung je Verteiler wählbar: je Abgang, gemeinsam durchgeschliffen
           oder über gebrückte Klemmen (-X1 oder eigene Leiste -X0); Quelle Abgang oder Steuer-LS
           (Abgang ohne Leitung); je Kreis eigener Abgriff möglich (Eingabe noch ohne Editor);
           im Steuerstromkreis nur die N-Leitung blau, Verbraucher bis zur Klemme/zum Abzweig schwarz
     v1.9: Etappe C1 – Blatt „Steuerstromkreis“ je Verteiler hinter seinem Stromlaufplan:
           Pfade mit 6 Kontaktplätzen und Verbraucherplatz, Zweige, Kontaktspiegel, Querverweise;
           Abgriff der Steuerspannung im Abgang; Befehlsgeber -S, Meldeleuchte -H
           (Eingabe noch ohne Editor, nur über Daten)
     v1.8: Namensnennung der QElectroTech-Schaltzeichen (CC BY 3.0) auf dem Startbildschirm
           und auf dem Deckblatt des Plans
     v1.7: Schaltgeräte je Abgang (Schütz, Stromstoßschalter, Zeitrelais) mit Kennzeichen -Q bzw. -K,
           N mitschalten, Ausstattung an Hilfskontakten; Hauptkontakte im Stromlaufplan,
           Schützzeichen im Übersichtsschaltplan, Herkunft im Klemmenplan, Zusatz im Türzettel
     v1.6: Bibliothek v1.4 mit den Zeichen für Steuerstromkreise (noch ohne Verwendung im Plan)
     v1.5: Klemmenplan der Klemmleiste -X1 je Verteiler (Tabelle mit Aderfarben br/sw/gr/bl/gnge)
           hinter den Stromlaufplänen, abschaltbar; N-Klemme je Verteiler wählbar
           (N-Trennklemme oder normale N-Klemme), auch im Stromlaufplan gezeichnet
     v1.4: Endklemmen (Geräteanschlussdose) und offene Enden schließen genau mit der
           Unterkante der Steckdosen ab, im Stromlaufplan und im Übersichtsschaltplan
     v1.3: Übersichtsschaltplan (einpolig) je Verteiler hinter dem Inhaltsverzeichnis,
           abschaltbar in den Projektdaten; einpolige Zeichen aus der Bibliothek v1.3
     v1.2: Deckblatt (Blatt 1) und Inhaltsverzeichnis (Blatt 2) vor den Planblättern,
           abschaltbar in den Projektdaten; Planblätter beginnen dann mit Blatt 3
     v1.1: Türzettel (Sicherungsübersicht) je Verteiler, A4 hoch, zum Ausdrucken
     v1.0: alle Linien in Leiterstärke (auch Sammelschienen und deren Querverweise);
           Verbindungspunkte überall, wo drei oder mehr Linien zusammentreffen
     v0.9: Untersammelschienen in Leiterstärke (0,25 mm); nur die Hauptsammelschienen bleiben 0,5 mm
     v0.8: Endklemmen der Anschlussdose auf Höhe der übrigen Abgangsenden
     v0.7: Anschluss auch als Geräteanschlussdose (Endklemmen, -X2 …) und als
           Leuchte (Lampenzeichen, -E1 …); Bibliothek v1.2
     v0.6: alle Abgänge enden ganz unten auf einer Höhe; Überspannungsschutz:
           PE-Seite der Ableiter grün
     v0.5: Schriftfeld als 20 mm hoher Streifen über die ganze Blattbreite
     v0.4: Plan: keine Leiter mehr übereinander in Gruppen (N/PE werden rechts
           neben dem Gruppengerät zugeführt), Untersammelschienen nur von der
           ersten bis zur letzten Verbindung, Abgänge einer Reihe enden auf
           gleicher Höhe (auch feste Anschlüsse)
     v0.3: Etappe 4a – Generator: Bildschirm „Plan“ mit allen Blättern, Format A4/A3
           (A4 voreingestellt), Druck/PDF aller Blätter; Einspeisungsblatt bzw.
           kurze Einspeisung auf dem ersten Abgangsblatt, Abgänge, Gruppen mit
           Untersammelschiene, Querverweise, Blattnummern durchgehend
     v0.2: Abgangsklemmen je Verteiler wählbar (Klemmleiste / ohne, neu: ohne),
           je Abgang als Option abweichend (mit / ohne Klemmen)
     Bedienung wie im SF E-Plan: eigene Bildschirme, ein Feld je Fenster,
     sofort gespeichert, Zurück-Pfeil genügt.
     Gerätekennungen = Kennungen der Bibliothek v1.1. -->
<style>
:root{--grund:#f4f4f6;--flaeche:#e5e5ea;--karte:#fff;--karte2:#f8f8fa;--hover:#eeeef2;--tinte:#1b1c21;--leise:#5d6070;--linie:#e1e1e7;--linie2:#c6c7d0;

  --dunkel:#1f2026;--kopfglas:rgba(244,244,246,.92);--schleier:rgba(16,16,22,.38);--n:#1f5fd6;--pe:#1a8a3a;--ov:#6a35e8}

   bewusst getrennt vom N-Leiter (blau) und PE (grün) des Plans; dunkler Modus nur für die Oberfläche,
   Planblatt und Türzettel bleiben weiß */
@media (prefers-color-scheme:dark){:root{--grund:#141519;--flaeche:#0d0e11;--karte:#1d1e24;--karte2:#23242b;--hover:#2a2b33;--tinte:#ebebf0;--leise:#a3a6b4;
  --linie:#30323b;--linie2:#474a58;--akzent:#a988ff;--akzent-hell:#2b2340;--akzent-tief:#c9b3ff;--auf-akzent:#15161a;--warn:#f0a640;--warn-hell:#3a2a12;--rot:#ff8a7a;
  --rot-hell:#ff9a8f;--dunkel:#2c2d36;--kopfglas:rgba(20,21,25,.9);--schleier:rgba(0,0,0,.55);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--grund);color:var(--tinte);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.kopf{position:sticky;top:0;z-index:5;background:var(--kopfglas);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--linie);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;min-height:52px}

main{max-width:760px;margin:0 auto;padding:12px 16px 60px}

.zeile:first-child{border-top:0}

.zeile:disabled{cursor:default}.zeile:disabled .ob,.zeile:disabled .schalter{opacity:.5}.zeile:disabled .un{white-space:normal}
.zeile .pfeil{color:var(--linie2);flex:0 0 auto}

.wahl.mitklein button{flex-direction:column;align-items:stretch;gap:2px}

/* ab v1.71: lange Fenster (Projekt öffnen mit Ersetzungsliste) – Kopf und Knöpfe bleiben im Bild, der Inhalt scrollt */

.fenster.lang:not(.pop) .inhalt{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}

.feldfehler{color:var(--rot);font-size:13px;margin:6px 2px 0}.zeile .un.feldfehler{color:var(--rot);white-space:normal;overflow:visible}.feldfehler[hidden]{display:none !important}input.fehler{border-color:var(--rot) !important;outline-color:var(--rot)}
.feldfehler.feldwarn,.zeile .un.feldfehler.feldwarn{color:var(--warn)}input.warn{border-color:var(--warn) !important;outline-color:var(--warn)}
.sort{display:flex;gap:4px;flex:0 0 auto}

.vorlagenwahl{max-height:none;overflow:hidden}.vorlagenwahl>*{flex-shrink:0}
.vorlagenwahl .vlz{display:flex;align-items:stretch;border-top:1px solid var(--linie)}
.vorlagenwahl .vlz>button[role=radio]{flex:1 1 auto;border-top:0;min-width:0}
.vorlagenwahl .vlz>.ikon{flex:0 0 auto;border:0;border-left:1px solid var(--linie);border-radius:0;justify-content:center;align-items:center;padding:0 12px;color:var(--leise)}
.vorlagenwahl .wahlkopf+.vlz{border-top:0}
/* ab v1.81 (X06): Formular „Revision festschreiben“ – Feldname über dem Feld */
.revform{display:grid;gap:10px}.revform .revfeld{display:grid;gap:4px}.revform .revfeld>span{font-size:13px;color:var(--leise)}
.meldung{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--tinte);color:var(--karte);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.meldung.an{opacity:.92}
.blattkarte{background:var(--flaeche);border-radius:12px;padding:10px;margin-bottom:14px}
.blattkarte .bt{font-size:13px;color:var(--leise);margin:0 2px 6px;display:flex;justify-content:space-between}
.blattkarte svg{display:block;width:100%;height:auto;background:var(--karte);box-shadow:0 2px 8px rgba(0,0,0,.18)}
/* Türzettel: auf dem Bildschirm als Blatt, im Druck A4 hoch */
.tz{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;padding:14mm 12mm;box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:4px;margin-bottom:16px}
.tz h1{font-size:22pt;margin:0 0 2pt}
.tz .tzu{font-size:10.5pt;color:#333;margin-bottom:10pt}
.tz table{width:100%;border-collapse:collapse;font-size:11pt;table-layout:fixed}      /* ab v1.64 (F07): gleiche Spalten auf allen Seiten */
.tz td{overflow-wrap:anywhere;hyphens:auto}.tz .nw{white-space:nowrap}
.tz th{text-align:left;font-size:9pt;color:#333;border-bottom:1.2pt solid #000;padding:3pt 4pt}
.tz td{border-bottom:.5pt solid #999;padding:4pt 4pt;vertical-align:top}
.tz td.k{font-weight:700;white-space:nowrap}
.tz td:nth-child(3){white-space:nowrap}
.tz tr.tzkopf td{background:#eee}
.tz tr.gruppe td{background:#f3f3f3;font-weight:700;border-bottom:.8pt solid #000}
.tz tr.ein td:nth-child(2){padding-left:14pt}
.tz .fuss{font-size:8.5pt;color:#555;margin-top:8pt;display:flex;justify-content:space-between;gap:12pt}
.tzwrap{overflow-x:auto}
.tzwrap .tz{min-width:600px}
/* Prüfprotokoll (ab v1.79, X05): A4 quer, auf dem Bildschirm als Blatt mit 10 mm Rand, im Druck Rand über @page; Maße in mm,
   damit Vorschau und Druck gleich umbrechen; alle Schrift schwarz */
.pp{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:8pt;width:297mm;min-height:210mm;padding:10mm;box-sizing:border-box;
  box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:4px;transform-origin:0 0;cursor:zoom-in;display:flex;flex-direction:column}
.pp.flach{width:277mm;min-height:0;padding:0;box-shadow:none;border-radius:0}
.pp sub{font-size:70%;line-height:0}
.pp .pptitel{display:flex;justify-content:space-between;align-items:baseline;gap:6mm;border-bottom:.5mm solid #000;padding-bottom:1mm;margin-bottom:2mm}
.pp h1{font-size:13pt;margin:0;font-weight:700}
.pp .ppvt{font-size:13pt;font-weight:700;white-space:nowrap}
.pp .ppkopf{display:grid;grid-template-columns:1fr 1fr 1.25fr;border:.3mm solid #000;border-bottom:0;border-right:0}
.pp .ppf{display:flex;gap:2mm;align-items:baseline;border-bottom:.3mm solid #000;border-right:.3mm solid #000;padding:.8mm 1.5mm;min-height:5.5mm;box-sizing:border-box;min-width:0}
.pp .ppf.breit{grid-column:1 / -1}
.pp .ppl{font-size:7pt;white-space:nowrap;flex:0 0 auto}
.pp .ppw{flex:1 1 auto;font-weight:700}
.pp .ppart .ppw{font-weight:400;display:flex;gap:3mm;flex-wrap:wrap}
.pp .ppk{display:inline-flex;align-items:center;gap:1.2mm;white-space:nowrap}
.pp .kk{display:inline-block;width:2.8mm;height:2.8mm;border:.3mm solid #000;box-sizing:border-box;vertical-align:middle;flex:0 0 auto}
.pp .ppchecks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4mm;margin:2mm 0;font-size:7.5pt;align-items:start}
.pp .ppcheck{width:100%;border-collapse:collapse}
.pp .ppcheck th{text-align:left;font-size:7.5pt;border-bottom:.3mm solid #000;padding:.4mm 1mm;white-space:nowrap}
.pp .ppcheck th:not(:first-child),.pp .ppcheck td:not(:first-child){width:9mm;text-align:center}
.pp .ppcheck td{border-bottom:.2mm solid #999;padding:.4mm 1mm;line-height:1.15}
.pp .ppallg{display:flex;flex-wrap:wrap;gap:1mm 4mm;margin-top:1.5mm}
.pp .ppallg .ppk{margin-left:1.5mm}
.pp .pptab{width:100%;border-collapse:collapse;table-layout:fixed}
.pp .pptab th{font-size:7pt;font-weight:700;text-align:left;border:.3mm solid #000;padding:.6mm .8mm;vertical-align:bottom;line-height:1.15}
.pp .pptab tr.ppgr th{text-align:center;vertical-align:middle;font-size:7.5pt}
.pp .pptab .ppmess{border-left:.6mm solid #000}
.pp .pptab td{border:.2mm solid #000;padding:.5mm .8mm;height:5.6mm;box-sizing:border-box;vertical-align:middle;overflow-wrap:anywhere;line-height:1.15}
.pp .pptab td.k{font-weight:700;white-space:nowrap;overflow-wrap:normal}
.pp .pptab td.nw,.pp .pptab .nw{white-space:nowrap}
.pp .pptab .z{text-align:right}
.pp .pptab td.m{text-align:center}
.pp .pptab td:nth-child(9){border-left:.6mm solid #000}
.pp .pptab td.aus{background:#d9d9d9}
.pp .pptab tr.ppeinsp td,.pp .pptab tr.pgruppe td{font-weight:700}
.pp .pptab tr.ppeinsp td:not(.m),.pp .pptab tr.pgruppe td:not(.m){background:#f0f0f0}
.pp .pptab tr.pein td:nth-child(2){padding-left:3mm}
.pp .ppber{display:block;font-size:6.5pt}
.pp .ppergebnis{margin-top:2mm;border:.3mm solid #000;padding:1.2mm 2mm;display:flex;flex-direction:column;gap:1mm}
.pp .pperg1{display:flex;flex-wrap:wrap;gap:2mm 7mm;align-items:center}.pp .ppnext{margin-left:auto}
.pp .ppbem{display:grid;grid-template-columns:auto 1fr;gap:3mm;align-items:end}
.pp .ppbem .pplinie{border-bottom:.2mm solid #000;height:4.5mm}
.pp .ppunter{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.pp .ppunter .ppf{border-bottom:.2mm solid #000;border-right:0;padding:3mm 0 .5mm}
.pp .ppnote{font-size:6.5pt;margin:0;line-height:1.3}
.pp .fuss{font-size:7pt;margin-top:auto;padding-top:2mm;display:flex;justify-content:space-between;gap:12pt}
.ppwrap{margin-bottom:16px;overflow:hidden}
.ppwrap .pp{margin:0}
/* Leisten in der Eigenschaften-Leiste (Platz im Steuerstromkreis) */
.leiste{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.leiste button{border:1px solid var(--linie);background:var(--karte);border-radius:9px;padding:7px 11px;min-height:38px;cursor:pointer;font-size:14px;color:var(--akzent)}
.leiste button:hover{background:var(--hover)}
.leiste button.rot{color:var(--rot)}
.leiste button:disabled{opacity:.35;cursor:default;background:var(--karte)}
/* Startbildschirm (ab v1.21) */
main.start{max-width:1040px}
.abschnitt{display:flex;align-items:baseline;justify-content:space-between}      /* ab v1.69: Knopf auf der Grundlinie der Überschrift */
.abschnitt .kopfknopf{margin:0 4px}
.projektkarte{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;border:1px solid var(--linie);background:var(--karte);border-radius:16px;padding:16px 20px;cursor:pointer;margin-top:10px}
.projektkarte:hover,.vkarte:hover{border-color:var(--linie2);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.pk-klein{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--leise)}
.pk-titel{font-size:24px;font-weight:700;line-height:1.2}
.pk-un{color:var(--leise);font-size:13px}
.pk-aktion,.vk-aktion{color:var(--akzent);font-size:15px;font-weight:600;margin-top:8px}
.vkarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vkarte{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-height:132px;width:100%;border:1px solid var(--linie);background:var(--karte);border-radius:16px;padding:16px 18px;cursor:pointer}
.vk-name{font-size:17px;font-weight:700}
.vk-un{font-size:13px;color:var(--leise)}
.vk-warn{font-size:13px;color:var(--warn)}
.vk-aktion{margin-top:auto;padding-top:8px}
.vkarte.neu{border:1.5px dashed var(--linie2);background:none;align-items:center;justify-content:center;color:var(--leise);font-size:15px}
.vk-plus{font-size:24px;line-height:1;color:var(--akzent)}
.vkhalter{display:flex;flex-direction:column;gap:6px}
/* Projektliste (ab v1.56): Zeile und Knopf „…“ nebeneinander; das geöffnete Projekt mit violettem Rand links */
.pzeile{display:flex;align-items:stretch;border-top:1px solid var(--linie)}
.pzeile:first-child{border-top:0}
.pzeile .zeile{border-top:0;flex:1 1 auto;min-width:0}
.pzeile.aktiv{box-shadow:inset 3px 0 0 var(--akzent)}
.pzeile.aktiv .zeile .w{color:var(--leise);font-weight:400;font-size:13px;background:var(--grund);border:1px solid var(--linie);border-radius:7px;padding:2px 8px;flex:0 0 auto}      /* ab v1.58 (C36): Etikett, kein Link */
.projektknoepfe{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
/* ab v1.76 (X01): Papierkorb, Versionen, Sammeldatei */
.korb .pzeile{align-items:center}.korb .zeile .ob{color:var(--leise)}
.pwieder{flex:0 0 auto;margin:0 10px 0 4px}
.knopf.rottext{color:var(--rot,#c62828)}
.vliste .zeile .un{white-space:normal}
.vliste .vaktion{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.sammelwahl label{display:flex;gap:10px;align-items:center;padding:8px 4px;min-height:44px;border-top:1px solid var(--linie)}
.sammelwahl label:first-child{border-top:0}.sammelwahl input{width:20px;height:20px;flex:0 0 auto}.sammelwahl small{color:var(--leise);display:block}
.pmehr{flex:0 0 48px;border:0;border-left:1px solid var(--linie);background:none;font-size:20px;line-height:1;color:var(--akzent);cursor:pointer}
.pmehr:hover,.pmehr:active{background:var(--hover)}
/* Meldung mit Knopf (ab v1.56), z. B. „Rückgängig“ nach geänderten Kennzeichen */
.meldung.mitknopf{pointer-events:none}.meldung.mitknopf .mknopf{pointer-events:auto}      /* ab v1.57: nur der Knopf fängt Tipps ab */
.meldung .mknopf{margin-left:10px;border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 4px}
/* Sammeländerung (ab v1.56): Abgänge mit Kontrollkästchen */
.sammelzeile{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:44px;border-top:1px solid var(--linie);cursor:pointer}
.sammelzeile:first-child{border-top:0}
.sammelzeile.einr{padding-left:34px}
.sammelzeile input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--akzent);margin:0}
.sammelzeile .t{flex:1 1 auto;min-width:0}
.sammelzeile .un{display:block;font-size:13px;color:var(--leise)}
/* Fenster am angetippten Feld (ab v1.21) */
.schleier.pop{background:transparent;overflow:hidden}
.fenster.pop{position:fixed;max-width:none;border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.07);display:flex;flex-direction:column}
.fenster.pop h3{font-size:12px;font-weight:600;color:var(--leise);text-transform:uppercase;letter-spacing:.06em;padding:11px 14px 4px}
.fenster.pop .inhalt{overflow-y:auto;padding:2px 6px 6px;min-height:0;-webkit-overflow-scrolling:touch}
.fenster.pop .text{padding:0 8px;font-size:13.5px}
.fenster.pop .wahl{max-height:none;border:0;border-radius:0;gap:1px}
.fenster.pop .wahl button{border-top:0;border-radius:8px;padding:9px 10px}
.wahl button:hover{background:var(--hover)}
.wahl button[aria-checked="true"]:hover{background:var(--akzent-hell)}
.wahl.raster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;border:0;max-height:none}
.wahl.raster button{border:1px solid var(--linie);border-radius:9px;justify-content:center;padding:11px 4px;font-variant-numeric:tabular-nums}
.fenster.pop .wahl.raster button{border:1px solid var(--linie)}
.wahl.raster button[aria-checked="true"]{border-color:var(--akzent);background:var(--akzent-hell);color:var(--akzent);font-weight:600}
.wahl .trennlinie{height:1px;background:var(--linie);margin:5px 8px}
.wahl button.an{color:var(--akzent);font-weight:600}
.wahl button.gefahr{color:var(--rot)}
.menue button{flex-direction:column;justify-content:center;gap:0}
.menue button small{font-size:12.5px}
.kacheln{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px}
.anzahlzeile{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:8px 6px 2px;border-top:1px solid var(--linie);margin-top:4px;font-size:14px}
.anzahl{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
/* Text direkt in der Zeile */
.zeile.bearbeiten{cursor:default;background:var(--akzent-hell);flex-wrap:wrap}
.zeile.bearbeiten .t{flex:1 1 140px}
.zeile.bearbeiten input{flex:2 1 180px;min-width:0;font:inherit;padding:8px 10px;border:1.5px solid var(--akzent);border-radius:9px;background:var(--karte);outline:none}
.knopf.klein{padding:5px 12px;font-size:13px;border-radius:8px}
:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
.liste>.zeile:focus-visible{outline-offset:-2px;border-radius:10px}      /* ab v1.65 (F28): Ring innen, nicht von der Liste beschnitten */
/* ---- Plan-Editor (ab v1.21): Arbeitsfläche über den ganzen Bildschirm ---- */
body.imeditor{overflow:hidden;background:var(--flaeche)}
.ed{position:fixed;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"kopf kopf kopf" "pal flaeche eigen" "pal fuss eigen";background:var(--flaeche)}
.edkopf{grid-area:kopf;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:var(--karte);border-bottom:1px solid var(--linie);min-height:58px;z-index:4}
.edkopf .sep,.kontext .sep{width:1px;height:24px;background:var(--linie);margin:0 4px;flex:0 0 auto}
.ikon{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:42px;height:42px;padding:0 9px;border:0;border-radius:10px;background:none;color:var(--tinte);cursor:pointer;flex:0 0 auto;font-size:14.5px}
.ikon svg{width:22px;height:22px;flex:0 0 auto}
.ikon:hover{background:var(--hover)}
.ikon:disabled{opacity:.28;cursor:default;background:none}
.ikon.rot{color:var(--rot)}
.vwahl{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;border:0;background:none;padding:2px 10px;height:46px;border-radius:10px;cursor:pointer;min-width:0;max-width:none;flex:0 1000 auto;text-align:left}
/* ab v1.68 (N1): keine feste Höchstbreite – der Name nimmt den freien Platz und gibt als Erstes nach (Schrumpfen 1000), gekürzt wird erst,
   wenn die Befehle schon nur Symbole zeigen (kopfEinpassen) */
.vwahl:hover{background:var(--hover)}
.vw-pj{font-size:11.5px;color:var(--leise);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-name{font-size:16.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.segment{display:inline-flex;background:var(--grund);border:1px solid var(--linie);border-radius:11px;padding:3px;margin-left:10px;flex:0 0 auto}
.segment button{border:0;background:none;padding:7px 16px;border-radius:8px;font-size:14.5px;font-weight:600;color:var(--leise);cursor:pointer;min-height:36px}
.segment button[aria-selected="true"]{background:var(--karte);color:var(--tinte);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.luecke{flex:1}
.edpal{grid-area:pal;width:calc(104px + env(safe-area-inset-left, 0px));overflow-y:auto;overscroll-behavior:contain;background:var(--karte);border-right:1px solid var(--linie);padding:6px 6px 20px;z-index:2}
.palgruppe{margin-bottom:8px}
.paltitel{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--leise);margin:8px 4px 4px}
.palkacheln{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.palleer{font-size:12.5px;color:var(--leise);padding:8px 6px;line-height:1.35}
.pallink{border:0;background:none;color:var(--akzent);font-size:13px;padding:8px 4px;cursor:pointer;text-align:left}
.werkzeug{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;min-height:62px;padding:6px 4px;border:1.5px solid transparent;border-radius:10px;background:none;
  cursor:pointer;font-size:11.5px;line-height:1.15;text-align:center;color:var(--tinte);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;position:relative}
.werkzeug:hover{background:var(--hover)}
.werkzeug svg{width:32px;height:32px;flex:0 0 auto}
.werkzeug[aria-pressed="true"]{background:var(--akzent-hell);border-color:var(--akzent);color:var(--akzent);font-weight:600}
.wzusatz{position:absolute;top:5px;right:6px;font:700 11px/1 system-ui,sans-serif;background:var(--tinte);color:var(--karte);border-radius:5px;padding:3px 4px}
.edflaeche{grid-area:flaeche;overflow:auto;position:relative;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.blaetter{position:relative;padding:18px 20px 48px;width:max-content;min-width:100%}
.blatt{margin:0 auto 26px}
.blatt .bt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--leise);margin:0 2px 6px}
.blatt svg{display:block;background:var(--karte);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.10),0 8px 24px rgba(0,0,0,.08)}
.ed svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ed rect.ziel{cursor:pointer;outline:none}
@media (hover:hover){.ed rect.ziel:hover{fill:rgba(106,53,232,.07)}}
.ed rect.ziel[data-sel]{fill:rgba(106,53,232,.12);stroke:var(--ov);stroke-width:.7}
.ed rect.teil{pointer-events:none}
.ed .nadel{pointer-events:none}
.blatt .btr{display:flex;align-items:center;gap:10px}
.festknopf{border:1px solid var(--linie2);background:var(--karte);color:var(--leise);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer}
.festknopf:hover{color:var(--akzent);border-color:var(--akzent)}
.festknopf.an{background:var(--akzent-hell);color:var(--akzent);border-color:var(--akzent)}
.ed .auswahlrahmen{fill:rgba(106,53,232,.06);stroke:var(--ov);stroke-width:.3;pointer-events:none}
.ed .auswahlrahmen.schneidet{stroke-dasharray:1.2 .8}
.ed [data-zusatz]{pointer-events:none}
.ed rect.ziel[data-hover],.ed rect.teil[data-aktiv][data-hover]{fill:rgba(106,53,232,.10)}
.ed .marke[data-hover] circle:not(.treffer){fill:var(--ov)}
.lupe{position:fixed;z-index:41;width:140px;height:140px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid var(--ov);box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:none}
.lupe svg{display:block;width:100%;height:100%}
/* ab v1.53: Blatt in der Ansicht „Stromlaufplan“ vergrößern (Pinch, Doppeltipp, Wischen zum Nachbarblatt) */
.lupe.planlupe{inset:0;width:auto;height:auto;border-radius:0;border:0;box-shadow:none;pointer-events:auto;display:flex;flex-direction:column;background:var(--flaeche);z-index:35}
.planlupe .lupekopf{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px 14px;background:var(--karte);border-bottom:1px solid var(--linie);min-height:52px}
.planlupe .lupetitel{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.planlupe .lupezoom{font-variant-numeric:tabular-nums;font-size:13px;color:var(--leise);padding:0 6px}

// Name abfragen (ab v1.54): Vorschlag markiert und sofort überschreibbar, „Anlegen“ erst mit Namen
function nameFenster(titel, text, vorschlag, platz, knopfText, fertigF) {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();     // Eingabe trifft nicht mehr die Karte dahinter
  const i = h('input', { type: 'text', value: vorschlag || '', placeholder: platz || '', autocapitalize: 'sentences', enterkeyhint: 'done', 'aria-label': text });
  const hw = h('p', { class: 'feldfehler', 'aria-live': 'polite', hidden: true }, 'Bitte einen Namen eingeben.');
  let an = null;
  const los = s => { const n = i.value.trim(); if (!n) { i.focus(); return; } s(false); fertigF(n); };
  const schl = fenster(titel, [h('p', { class: 'text' }, text), i, hw], s => [
    h('button', { class: 'knopf zweit', on: { click: () => s(false) } }, 'Abbrechen'),
    an = h('button', { class: 'knopf', on: { click: () => los(s) } }, knopfText)]);
  const pruef = () => { const leer = !i.value.trim(); an.disabled = leer; hw.hidden = !leer; };
  i.addEventListener('input', pruef);
  i.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); los(schl); } });
  pruef(); i.focus(); i.select();
  requestAnimationFrame(() => { if (document.activeElement !== i && i.isConnected) { i.focus(); i.select(); } });
}

// ---- Bildschirme -----------------------------------------------------------
function zeichne() {
  const b = stapel[stapel.length - 1];
  // ab v1.65 (F23): lag der Fokus auf der Arbeitsfläche (bzw. nirgends), bekommt ihn die neue Fläche – nach Entf, Strg+V/D/X …
  const ak = document.activeElement, flFokus = !ak || ak === document.body || !!(ED && ED.flaeche.contains(ak));
  if (ED && ED.ro) ED.ro.disconnect();
  if (planLupeOffen) planLupeOffen.zu();
  ED = null;
  app.innerHTML = '';
  document.body.classList.toggle('imeditor', b.s === 'editor'); document.body.classList.remove('fachoffen');
  ({ start: bStart, projekte: bProjekte, projekt: bProjekt, verteiler: bVerteiler, einspeisung: bEinspeisung, kopf: bKopf, gruppe: bGruppe, abgang: bAbgang, liste: bListe, stueck: bStueck, plan: bPlan, tuer: bTuer, pruef: bPruef,
     steuerung: bSteuerung, kreis: bKreis, sgeraet: bSGeraet, editor: bEditor }[b.s])(b);
  // ab v1.67 (I3-04): im Editor fällt der Fokus nach dem Neuzeichnen nie auf body (Palette, Fachzeile, Rückkehr aus der Vorschau)
  if (flFokus || b.s === 'editor') flaecheFokus();
  // ab v1.67 (GZ9, I3-02, DS3-06): eine Meldung gehört zur Seite, auf der sie entstand – beim Wechsel der Seite schließt sie
  // (nicht die eben zur selben Handlung gesetzte), sonst wird ihre Lage neu bestimmt (Fußleiste nur im Editor)
  const mEl = document.getElementById('meldung');
  if (zeichne.seite && zeichne.seite !== b.s && mEl.classList.contains('an') && Date.now() - (meldung.zeit || 0) > 300) { clearTimeout(meldung.t); mEl.classList.remove('an', 'mitknopf', 'imfuss'); }
  zeichne.seite = b.s; meldungNeuLegen();
  historie();
}
// Fokus auf die Arbeitsfläche (ab v1.65, F23), wenn er sonst auf body fiele – nie aus einem Fenster oder Feld heraus
function flaecheFokus() {
  const a = document.activeElement;
  if (ED && ED.flaeche.isConnected && !fensterStapel.length && (!a || a === document.body)) ED.flaeche.focus({ preventScroll: true });
}

// TE-Richtwert, Klemmen (dieselbe Quelle wie der Klemmenplan), Leitungen mit Längen und die Geräte im Feld (Steckdosen mit
// ihrer Anzahl je Stromkreis, Leuchten, Motoren, Befehlsgeber …). Gleiche Geräte mit gleicher Bemessung bilden eine Position.
// TE-Summe mit 20 % Reserve und Reihen zu 12 TE als Hilfe für die Gehäusewahl. Projekt: alle Verteiler zusammengefasst.
// Der TE-Aufbauplan bleibt zurückgestellt (herstellerabhängig).
const SL_ABSCHNITT = [['geraete', 'Reiheneinbaugeräte im Verteiler'], ['einbau', 'Weitere Einbauten im Verteiler (ohne TE-Richtwert)'],
  ['klemmen', 'Klemmen'], ['leitungen', 'Leitungen'], ['feld', 'Im Feld']];

const SCHALT_TE = { schuetz: 2, stromstoss: 1, zeitrelais: 1 };
// Steuertrafo als Reiheneinbaugerät nach der Leistung (Richtwert), darüber Einbau nach Herstellerangabe
const trafoTe = va => { const x = zahlVon(va); return !x ? null : x <= 10 ? 2 : x <= 30 ? 3 : x <= 63 ? 4 : x <= 100 ? 5 : null; };
// Steckdosen je Stromkreis (ab v1.80, X16): k.ziel.anzahl, fehlt = 1
const steckdosen = k => !k.speist && (k.ziel.anschluss === 'steckdose3' || k.ziel.anschluss === 'steckdose5') ? Math.max(1, Math.round(zahlVon(k.ziel.anzahl)) || 1) : 0;
const anzahlText = k => { const n = steckdosen(k); return n > 1 ? `${n}\u00a0Steckdosen` : ''; };
const teText = x => x == null ? '' : String(Math.round(x * 10) / 10).replace('.', ',');
// Kennzeichen zusammenfassen: -F3, -F4, -F5 → -F3…-F5 (lückenlos fortlaufend)
function kennKurz(liste) {
  const r = [], nat = t => { const x = /^(.*?)(\d+)$/.exec(t); return x ? [x[1], +x[2]] : [t, NaN]; };
  [...new Set(liste)].map(t => [t, ...nat(t)]).sort((a, b) => a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : (a[2] || 0) - (b[2] || 0))
    .forEach(([t, pre, n]) => { const l = r[r.length - 1];
      if (l && l.pre === pre && !isNaN(n) && n === l.bis + 1) { l.bis = n; l.n++; } else r.push({ t, pre, von: n, bis: n, n: 1 }); });

  return r.map((x, i) => { const t = i && /:$/.test(x.pre) && r[i - 1].pre === x.pre ? String(x.von) : x.t, b = /:$/.test(x.pre) ? x.bis : x.pre + x.bis;

function stueckliste(v) {
  const e = berechne(v), oben = !speisenderAbgang(v.id), pos = new Map();
  const dazu = (ab, name, o = {}) => {
    const te = o.te === undefined ? null : o.te, key = [ab, name, o.bem || '', o.typ || '', o.pole || '', te].join('|');
    let p = pos.get(key);
    if (!p) pos.set(key, p = { ab, name, bem: o.bem || '', typ: o.typ || '', pole: o.pole || '', te, n: 0, kenn: [], l: 0, ohneL: 0, leitung: !!o.leitung });
    p.n += o.n === undefined ? 1 : o.n; if (o.kenn) p.kenn.push(o.kenn);
    if (o.leitung) { if (o.l) p.l += o.l; else p.ohneL++; }

  const geraet = (g, kenn, extra = {}) => {
    if (!g || !g.zeichen || !GERAETE[g.zeichen]) return;
    const d = GERAETE[g.zeichen], nb = '\u00a0', fi = d.fi ? `${g.idn || '30'}${nb}mA Typ${nb}${g.fityp || 'A'}` : '';
    const bem = d.bereich ? (g.bereich ? `${g.bereich}${nb}A` : '') : !d.ohneNenn && g.nenn ? `${g.nenn}${nb}A` : '';
    const typ = [d.kennlinie ? g.kennlinie || 'B' : d.sicherung ? g.art || 'gG' : '', fi].filter(Boolean).join(', ');
    const pole = extra.pole || (d.fi || d.n || /^spd/.test(g.zeichen) ? `${d.pole}+N` : String(d.pole));
    const te = extra.te !== undefined ? extra.te : d.te;
    dazu(te == null ? 'einbau' : 'geraete', extra.name || d.name, { bem, typ, pole, te, kenn });
  };
  for (const f of ['vorsicherung', 'zaehler', 'hauptschalter', 'spd']) {
    const g = v[f]; if (!g.zeichen) continue;
    // Zähler im obersten Verteiler: Zählerplatz des Netzbetreibers (eHZ) – kein Reiheneinbaugerät
    if (f === 'zaehler' && oben) dazu('einbau', `${GERAETE[g.zeichen].name} (Zählerplatz)`, { pole: String(GERAETE[g.zeichen].pole), kenn: e.kopf.zaehler.t });
    else geraet(g, e.kopf[f].t);
  }
  const lt = (typ, adern, quer, kenn, l) => dazu('leitungen', `Leitung ${typ || 'NYM-J'} ${adern}×${quer || '?'}`, { kenn, leitung: true, l: zahlVon(l) });
  alleKnoten(v, k => {
    if (k.typ === 'gruppe') { geraet(k.geraet, e.geraete[k.id].t); return; }
    const a = e.abgaenge[k.id]; if (!a) return;
    // Primär-LS des Steuertrafos 400 V als LS 2-polig
    if (k.geraet.zeichen) geraet(k.geraet, a.f && a.f.t, gNameK(k) === 'LS 2-polig' ? { name: 'LS 2-polig', pole: '2', te: 2 } : {});
    const schalt = s => { const zr = s.typ === 'zeitrelais' && s.zr ? ZR_FKT[s.zr.fkt] : '';
      const hk = [s.hs ? `${s.hs}\u00a0S` : '', s.ho ? `${s.ho}\u00a0Ö` : ''].filter(Boolean).join(', ');
      dazu('geraete', SCHALT[s.typ] + (zr ? ' ' + zr : ''), { pole: String(s.pole.length), typ: hk ? 'Hilfskontakte ' + hk : '', te: SCHALT_TE[s.typ], kenn: s.bmk.t,
        bem: zr && s.zr.zeit ? `t\u00a0=\u00a0${s.zr.zeit}` : '' }); };
    if (a.schalt) schalt(a.schalt);
    (a.zusatz || []).forEach(z => schalt(z.schalt));
    if (a.ol) dazu('einbau', 'Überlastrelais', { bem: a.ol.bereich ? `${a.ol.bereich}\u00a0A` : '', typ: 'Anbau am Schütz', pole: '3', kenn: a.ol.bmk.t });
    if (a.mssHk && (a.mssHk.s || a.mssHk.o)) dazu('einbau', 'Hilfsschalter zum Motorschutzschalter', { typ: [a.mssHk.s ? `${a.mssHk.s}\u00a0S` : '', a.mssHk.o ? `${a.mssHk.o}\u00a0Ö` : ''].filter(Boolean).join(', '), kenn: a.f && a.f.t });
    if (a.fu) dazu('einbau', 'Frequenzumrichter', { bem: zahlVon(motorVon(k).kw) ? `${String(motorVon(k).kw).replace('.', ',')}\u00a0kW` : '', pole: '3', kenn: a.fu.t });
    if (a.p) geraet({ zeichen: a.drei ? 'zaehler3' : 'zaehler1' }, a.p.t, { name: `Zähler ${a.drei ? '3' : '1'}-phasig (Erzeugung)` });
    if (k.trafo) { const t = k.trafo, te = trafoTe(t.va);
      dazu(te == null ? 'einbau' : 'geraete', 'Steuertransformator', { bem: t.va ? `${t.va}\u00a0VA` : '', typ: `${t.prim}/${t.sek}\u00a0V`, te, kenn: a.t.t });
      geraet(t.ls, a.f2.t); }
    // Leitungen: Abgang (Stern-Dreieck mit zweiter Leitung), Länge je Leitung
    if (!k.steuer && !a.ohneLtg) {
      const typ = k.leitung.typ || 'NYM-J';
      if (a.sd) { lt(typ, 4, k.leitung.quer, a.w.t, k.leitung.laenge); lt(typ, /-J$/.test(typ) ? 4 : 3, k.leitung.quer, a.w2.t, k.leitung.laenge); }
      else lt(typ, a.leiter.length, k.leitung.quer, a.w.t, k.leitung.laenge);
    }
    // im Feld
    if (k.speist || k.steuer) return;
    const an = k.ziel.anschluss, xd = a.xd && a.xd.t;
    if (an === 'steckdose3') dazu('feld', 'Steckdose 1/N/PE', { n: steckdosen(k), kenn: xd });
    else if (an === 'steckdose5') dazu('feld', 'CEE-Steckdose 3/N/PE', { bem: k.geraet.nenn ? `${k.geraet.nenn}\u00a0A` : '', n: steckdosen(k), kenn: xd });
    else if (an === 'dose') dazu('feld', 'Geräteanschlussdose', { kenn: xd });
    else if (an === 'leuchte') dazu('feld', 'Leuchte', { kenn: xd });
    else if (an === 'wallbox') { const wb = k.wallbox || wallboxNeu();
      dazu('feld', 'Wallbox', { bem: `${wb.kw}\u00a0kW`, typ: wb.rdc ? 'mit DC-Fehlerstromerkennung' : '', pole: '3+N', kenn: xd }); }
    else if (an === 'motor') { const mo = motorVon(k);
      dazu('feld', mo.art === '1' ? 'Wechselstrommotor' : 'Drehstrommotor', { bem: zahlVon(mo.kw) ? `${String(mo.kw).replace('.', ',')}\u00a0kW` : '', kenn: xd }); }
    else if (an === 'pv') { const pv = pvVon(k);
      dazu('feld', pv.speicher ? 'Hybrid-Wechselrichter' : 'Wechselrichter', { pole: pv.phasen === '1' ? '1+N' : '3+N', kenn: a.t && a.t.t });
      if (a.dcq) dazu('feld', 'DC-Freischalter', { kenn: a.dcq.t });
      dazu('feld', 'PV-Generator', { bem: zahlVon(pv.kwp) ? `${String(pv.kwp).replace('.', ',')}\u00a0kWp` : '', kenn: a.g.t });
      if (pv.speicher) dazu('feld', 'Batterie', { bem: zahlVon(pv.speicher.kwh) ? `${String(pv.speicher.kwh).replace('.', ',')}\u00a0kWh` : '', kenn: a.bat.t }); }
    else if (an === 'speicher') { const sp = speicherVon(k);
      dazu('feld', 'Batteriewechselrichter', { bem: zahlVon(sp.kw) ? `${String(sp.kw).replace('.', ',')}\u00a0kW` : '', pole: sp.phasen === '1' ? '1+N' : '3+N', kenn: a.t.t });
      dazu('feld', 'Batterie', { bem: zahlVon(sp.kwh) ? `${String(sp.kwh).replace('.', ',')}\u00a0kWh` : '', kenn: a.bat.t }); }
  });
  // Steuerstromkreise: Befehlsgeber, Melder, Meldeleuchten, eigenständige Zeitrelais; im Verteiler als Reiheneinbaugerät (1 TE)
  const st = v.steuerung, sf = e.steuer;
  ((st && st.geraete) || []).forEach(g => {
    const kz = sf.geraete[g.id]; if (!kz) return;

    if (g.zeichen === 'zeitrelais' || !stFeld(g)) dazu('geraete', name, { te: 1, kenn: kz.t, bem: g.zeichen === 'zeitrelais' && g.zeit ? `t\u00a0=\u00a0${g.zeit}` : '' });
    else dazu('feld', name, { kenn: kz.t });

    });

}
// Liste fertigstellen: Reihenfolge nach Abschnitten, Nummern, Texte für Blatt, Bildschirm und CSV, TE-Summe und Fuß
function slFertig(titel, liste, projekt, teJe) {
  const ord = Object.fromEntries(SL_ABSCHNITT.map(([a], i) => [a, i]));
  const pos = liste.slice().sort((x, y) => ord[x.ab] - ord[y.ab]);
  pos.forEach((p, i) => {
    p.nr = i + 1; p.abT = SL_ABSCHNITT[ord[p.ab]][1];
    p.anzahl = String(p.n);
    if (p.leitung) p.bem = p.l ? `${dezimal(p.l)}\u00a0m${p.ohneL ? ` + ${p.ohneL}\u00a0ohne Länge` : ''}` : 'Länge offen';
    p.teGes = p.te == null ? null : p.te * p.n; p.teT = teText(p.teGes);
    p.kennT = projekt ? Object.entries(p.vt).map(([n, z]) => `${n} ${z}`).join(', ') : kennKurz(p.kenn.filter(Boolean));
  });
  const te = pos.reduce((s, p) => s + (p.ab === 'geraete' ? p.teGes || 0 : 0), 0), teRes = Math.ceil(te * (1 + SL_RESERVE) - 1e-9);
  const reihen = Math.ceil(teRes / SL_TE_REIHE), ohne = pos.filter(p => p.ab === 'einbau').reduce((s, p) => s + p.n, 0);
  const fuss = projekt
    ? [`TE je Verteiler: ${teJe.map(x => `${x.titel} ${teText(x.te)}\u00a0TE (${x.reihen}\u00a0${x.reihen === 1 ? 'Reihe' : 'Reihen'})`).join(' · ')}`]
    : [`Summe Reiheneinbaugeräte ${teText(te)}\u00a0TE · mit ${SL_RESERVE * 100}\u00a0% Reserve ${teRes}\u00a0TE · ${reihen}\u00a0${reihen === 1 ? 'Reihe' : 'Reihen'} zu ${SL_TE_REIHE}\u00a0TE`
      + (ohne ? ` · ${ohne} ${ohne === 1 ? 'Einbau' : 'Einbauten'} ohne TE-Richtwert` : '')];
  fuss.push('TE-Werte sind Richtwerte (1 TE = 18 mm), maßgeblich sind die Herstellerangaben. Klemmen, Leitungen und Geräte im Feld zählen nicht zur TE-Summe.');
  return { titel, projekt, pos, te, teRes, reihen, fuss };
}
// Projekt: alle Verteiler zusammengefasst; Spalte „Verteiler“ mit der Anzahl je Verteiler statt der Kennzeichen
function stuecklisteProjekt(listen) {
  const pos = new Map();
  listen.forEach(l => l.pos.forEach(p => {
    const key = [p.ab, p.name, p.leitung ? '' : p.bem, p.typ, p.pole, p.te].join('|');
    let q = pos.get(key);
    if (!q) pos.set(key, q = { ab: p.ab, name: p.name, bem: p.bem, typ: p.typ, pole: p.pole, te: p.te, n: 0, l: 0, ohneL: 0, leitung: p.leitung, kenn: [], vt: {} });
    q.n += p.n; q.l += p.l; q.ohneL += p.ohneL; q.vt[l.titel] = (q.vt[l.titel] || 0) + p.n;
  }));
  // innerhalb eines Abschnitts nach Gerät und Bemessung (Zahlen der Größe nach)
  const ord = Object.fromEntries(SL_ABSCHNITT.map(([a], i) => [a, i])), cmp = (a, b) => String(a).localeCompare(String(b), 'de', { numeric: true });
  const alle = [...pos.values()].sort((x, y) => ord[x.ab] - ord[y.ab] || cmp(x.name, y.name) || cmp(x.bem, y.bem) || cmp(x.typ, y.typ));
  return slFertig('Alle Verteiler', alle, true, listen);
}
// Listen für Blatt, Bildschirm und CSV: je Verteiler eine, bei mehreren Verteilern dazu die Projektliste

  try { d = JSON.parse((await f.text()).replace(/^\ufeff/, '')); }
  catch (e) { nichtOeffnen('Die Datei ist leer, abgeschnitten oder keine Projektdatei (Endung .slp.json)'); return; }
  if (d && typeof d === 'object' && d.format === 'slp-sammlung') { sammlungOeffnen(d, f.name); return; }      // ab v1.76 (X01)
  if (d && typeof d === 'object') { datVersion = Number(d.version) || 1; datApp = typeof d.app === 'string' ? d.app : ''; }
  try { rep = pruefeProjekt(d, true); migriere(d); }
  catch (e) { nichtOeffnen(e.message === 'keine Stromlaufplan-Datei' ? 'Das ist keine Projektdatei dieser App (Endung .slp.json)' : 'Die Projektdaten sind unvollständig'); return; }
  try { probeProjekt(d); }
  catch (e) {
    // ab v1.71 (Q18): scheitert der Plan an den Vorgaben von Hand, lässt sich die Datei ohne sie öffnen (die Automatik ordnet neu)
    const ohne = kopie(d); ohne.verteiler.forEach(v => { delete v.layout; });
    try { if (!d.verteiler.some(v => v.layout)) throw e; probeProjekt(ohne); } catch (e2) {
      console.warn(e2); nichtOeffnen('Der Plan ließ sich mit diesen Daten nicht zeichnen'); return; }
    console.warn(e); d = ohne; ohneVorgaben = true; rep.push('Vorgaben von Hand (Lage, Leiterwege, Zusätze) verworfen – der Plan ließ sich damit nicht zeichnen');
  }
  const neuer = datVersion > PROJEKT_VERSION, name = projektName(d);
  // ab v1.56: als weiteres Projekt; gibt es eines mit demselben Namen, wahlweise dieses ersetzen
  const gleich = projektListeAnzeige().find(x => (x.id === projektId ? projektName(P) : x.name) === name);
  let umbenannt = false;
  const uebernehmen = (s, ersetzId) => {
    // ab v1.58 (C37): als weiteres Projekt mit vergebenem Namen – „ (2)“, „ (3)“ … im Projekt selbst (Liste und Deckblatt gleich)
    if (!ersetzId && gleich) { const da = new Set(projektListeAnzeige().map(x => x.id === projektId ? projektName(P) : x.name)); let n = 2;
      while (da.has(`${name} (${n})`)) n++; d.projekt = d.projekt || {}; d.projekt.projekt = `${name} (${n})`; umbenannt = true; }
    // erst nach erfolgreichem Zeichnen speichern; sonst bleibt der bisherige Stand
    const alt = { P, projektId, zurueck: verlauf.zurueck, vor: verlauf.vor, stand: verlauf.stand }, altStapel = stapel;
    if (ersetzId) { if (ersetzId !== projektId) { let x; try { x = projektLesen(ersetzId); } catch (e) { x = neuesProjekt(); } projektAktiv(ersetzId, x); } P = d; }
    else if (projektLeer(P)) P = d;
    else projektAktiv(id(), d);
    stapel = [{ s: 'start' }];
    try { zeichne(); } catch (e) {
      P = alt.P; projektId = alt.projektId; Object.assign(verlauf, { zurueck: alt.zurueck, vor: alt.vor, stand: alt.stand });
      try { localStorage.setItem(PAKTIV, projektId); } catch (er) {}
      stapel = altStapel; s(false); zeichne(); console.warn(e); nichtOeffnen('Der Plan ließ sich mit diesen Daten nicht zeichnen'); return; }
    aenderung(ersetzId ? 'Projekt ersetzen' : 'Projekt öffnen'); sichern(); exportStand('importiert'); s();
    if (umbenannt) setTimeout(() => meldung(`Als „${projektName(P)}“ angelegt – den Namen „${name}“ gibt es schon`), 0);
    if (rep.length) setTimeout(() => meldung(`Datei geöffnet, ${rep.length} Angabe${rep.length === 1 ? '' : 'n'} ersetzt`), 0);
  };
  fenster('Projekt öffnen', h('div', { class: 'text' }, ohneVorgaben
      ? h('p', {}, 'Mit den Vorgaben von Hand (verschobene Geräte und Leiter, freie Leiter, Texte und Rahmen) ließ sich der Plan nicht zeichnen. '
        + 'Ohne diese Vorgaben öffnet er sich; die Automatik ordnet dann alles neu. Die Datei selbst bleibt unverändert.') : null, h('p', {}, gleich
      ? `Ein Projekt „${name}“ gibt es auf diesem Gerät schon. Ersetzen oder als weiteres Projekt anlegen?`
      : projektLeer(P) ? `„${name || f.name}“ wird geöffnet und ersetzt das leere Projekt.`      // ab v1.65 (F12)
      : `„${name || f.name}“ wird als weiteres Projekt angelegt; die übrigen Projekte bleiben.`) , neuer
      // ab v1.70 (Q34): sagt, was wirklich geschieht
      ? h('p', {}, `Achtung: Die Datei stammt aus einer neueren Fassung der App${datApp ? ` (${datApp})` : ''}. Angaben, die diese Fassung (${APP_FASSUNG}) nicht kennt, `
        + 'bleiben in den Daten, soweit möglich, erhalten, erscheinen aber nicht im Plan und lassen sich hier nicht bearbeiten. Gespeichert wird das Projekt als Stand dieser Fassung. '
        + 'Am besten mit der neueren App weiterarbeiten.') : null,
    rep.length ? h('p', {}, `Beim Prüfen ersetzt (${rep.length}):`) : null, rep.length ? h('ul', {}, ...rep.slice(0, 10).map(t => h('li', {}, t))) : null,
    rep.length > 10 ? h('p', {}, `… und ${rep.length - 10} weitere`) : null), s => [
    h('button', { class: 'knopf zweit', on: { click: () => s(false) } }, 'Abbrechen'),
    gleich ? h('button', { class: 'knopf zweit', on: { click: () => uebernehmen(s, gleich.id) } }, 'Ersetzen') : null,
    h('button', { class: 'knopf', on: { click: () => uebernehmen(s, null) } }, gleich ? 'Als weiteres Projekt' : ohneVorgaben ? 'Ohne Vorgaben von Hand öffnen' : 'Öffnen')], null, { cls: 'lang' });
});

// Meldung unten; ab v1.56 wahlweise mit Knopf [Text, Aktion] (steht dann länger und ist antippbar)
// ab v1.70: opt.bleibt – die Meldung steht, bis eine andere sie ersetzt (z. B. „Nicht gespeichert“)
function meldung(t, knopf = null, opt = {}) {
  const m = document.getElementById('meldung'); m.textContent = ''; m.append(h('span', { class: 'mtext' }, t)); m.classList.add('an'); m.classList.toggle('mitknopf', !!knopf);
  m.title = t;      // ab v1.66 (F17): in der Fußleiste einzeilig, der ganze Text im Tooltip
  if (knopf) m.append(h('button', { class: 'mknopf', on: { click: () => { clearTimeout(meldung.t); m.classList.remove('an', 'mitknopf'); knopf[1](); } } }, knopf[0]));
  const imFuss = meldungImFuss();
  clearTimeout(meldung.t); if (!opt.bleibt) meldung.t = setTimeout(() => m.classList.remove('an', 'mitknopf'), knopf || imFuss ? 6000 : 2200);
  meldung.zeit = Date.now(); meldungLage(); requestAnimationFrame(meldungLage);
}
// ab v1.66 (F17): am Desktop (Maus) steht die Meldung im Editor in der Fußleiste an Stelle des Zustandstexts – sie deckt weder
// Blatt noch Schriftfeld noch Fach; Touch und schmale Fenster wie bisher über der Fußleiste
function meldungImFuss() {
  const hz = ED && ED.ed.isConnected && feinZeiger() && ED.fuss.querySelector('.hinweiszeile');
  return hz && hz.offsetWidth > 120 ? hz : null;
}
// Lage der Meldung im Editor unter 1000 px (ab v1.58, C13): nie über Kontextleiste, Werkzeugband, Fußleiste oder Fach –
// liegen Leiste bzw. Band in der oberen Hälfte der Fläche, steht die Meldung unten (über Fußleiste bzw. Fach), sonst oben
function meldungLage() {
  const m = document.getElementById('meldung'); m.style.top = m.style.bottom = m.style.left = m.style.width = m.style.height = '';
  const mt0 = m.querySelector('.mtext'); if (mt0 && m.title) mt0.textContent = m.title;      // ab v1.67: ungekürzt, gekürzt wird nur in der Fußleiste
  const hz = meldungImFuss(); m.classList.toggle('imfuss', !!hz);
  if (hz) {      // ab v1.66 (F17): über dem Text der Hinweiszeile, ein „Fertig“ daneben bleibt frei
    const r = hz.getBoundingClientRect(), kn = hz.querySelector('.knopf'), re = kn ? kn.getBoundingClientRect().left - 8 : r.right;
    m.style.left = Math.round(r.left) + 'px'; m.style.width = Math.max(80, Math.round(re - r.left)) + 'px';
    m.style.top = Math.round(r.top) + 'px'; m.style.height = Math.round(r.height) + 'px'; m.style.bottom = 'auto';
    // ab v1.67 (GZ12): passt der Text nicht, entfallen erst die Klammer, dann hintere Teile ab „ · “ – nie mitten im Wort
    const mt = m.querySelector('.mtext');
    for (const f of [x => x.replace(/ \([^()]*\)$/, ''), x => x.replace(/ · [^·]*$/, '')]) { if (!mt || mt.scrollWidth <= mt.clientWidth + 1) break; mt.textContent = f(mt.textContent); }
    return;
  }
  if (!ED || !ED.ed.isConnected || !schmal()) return;
  const F = ED.flaeche.getBoundingClientRect(), mitte = F.top + F.height / 2;
  const im = [ED.blaetter.querySelector('.kontext'), ED.band && !ED.band.hidden ? ED.band : null].filter(Boolean).map(x => x.getBoundingClientRect()).filter(r => r.height);
  const ob = im.some(r => r.top + r.height / 2 < mitte);
  const fach = ED.eigen.getBoundingClientRect(), fuss = ED.fuss.getBoundingClientRect();
  const grenze = Math.min(fuss.top, ED.fach && ED.fach !== 'zu' ? fach.top : innerHeight);
  if (ob) { m.style.bottom = Math.round(innerHeight - grenze + 8) + 'px'; m.style.top = 'auto'; }
  else { const k = Math.max(ED.pal.getBoundingClientRect().bottom, ED.ed.querySelector('.edkopf').getBoundingClientRect().bottom, F.top);
    const unten = im.length ? Math.min(...im.map(r => r.top)) : innerHeight;
    m.style.top = Math.round(k + 8) + 'px'; m.style.bottom = 'auto';
    // reicht der Platz über der Leiste nicht, unten über Fußleiste bzw. Fach
    if (k + 8 + m.offsetHeight > unten - 4) { m.style.top = 'auto'; m.style.bottom = Math.round(innerHeight - grenze + 8) + 'px'; } }
}
function fehler(t) { const f = document.getElementById('fehlerband'); f.textContent = 'Fehler: ' + t; f.style.display = 'block'; }
window.addEventListener('error', e => fehler(e.message));
window.addEventListener('unhandledrejection', e => fehler(e.reason && e.reason.message || String(e.reason)));
// Bildschirmtastatur (ab v1.55): Wird im Fach (iPad hoch) ein Feld bearbeitet, hebt sich das Fach über die Tastatur
// (iOS verkleinert nur den sichtbaren Ausschnitt, visualViewport), und das Feld rückt in die Mitte des Fachs
(() => {
  const vv = window.visualViewport; if (!vv) return;
  let gehoben = 0;
  const heben = zentrieren => {
    const fach = ED && ED.eigen, el = document.activeElement;
    const imFach = !!fach && schmal() && !!el && fach.contains(el) && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
    const kb = imFach ? Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop)) : 0, neu = kb > 60 ? kb : 0;
    if (fach && neu !== gehoben) { fach.style.bottom = neu ? neu + 'px' : ''; fach.style.maxHeight = neu ? Math.max(160, vv.height - 24) + 'px' : ''; }
    gehoben = fach ? neu : 0;
    if (neu && zentrieren) el.scrollIntoView({ block: 'center' });
    // ab v1.82 (X09): die Vorschlagszeile unter dem Feld bleibt über der Tastatur sichtbar (Fach, Fenster und Seite)
    const vz = el && el.getAttribute && document.getElementById(el.getAttribute('aria-controls') || '-');
    if (vz && vz.classList.contains('vorschlaege') && !vz.hidden && innerHeight - vv.height - vv.offsetTop > 60) {
      const zuViel = vz.getBoundingClientRect().bottom - (vv.offsetTop + vv.height - 8);
      if (zuViel > 0) { let sc = vz.parentElement; while (sc && !(sc.scrollHeight > sc.clientHeight + 1 && /auto|scroll/.test(getComputedStyle(sc).overflowY))) sc = sc.parentElement;
        if (sc) sc.scrollTop += zuViel; else window.scrollBy(0, zuViel); }
    }
  };
  vv.addEventListener('resize', () => heben(true)); vv.addEventListener('scroll', () => heben(false));
  document.addEventListener('focusin', () => setTimeout(() => heben(true), 60));
  document.addEventListener('focusout', () => setTimeout(() => heben(false), 60));
})();
// Seitenzoom des Browsers nur im Editor und in der Lupe unterdrücken (dort zoomt die App selbst; ab v1.53)
document.addEventListener('gesturestart', e => { if (ED || planLupeOffen) e.preventDefault(); });
// Start (ab v1.52): gespeicherten Stand prüfen; lässt er sich nicht zeichnen, als Datei sichern und neu beginnen
try { pruefeProjekt(P); zeichne();
  if (defektStart) defektFenster(defektStart);      // ab v1.70 (Q01)
  else if (projekte.some(q => q.id === projektId)) gutMerken(projektId, verlauf.stand);      // der Stand beim Start gilt als gut
}
catch (e) {
  app.innerHTML = '';
  fenster('Gespeicherter Stand fehlerhaft', h('p', { class: 'text' }, `Das Projekt auf diesem Gerät lässt sich nicht öffnen (${e.message}). Bitte als Datei sichern und neu beginnen.`), s => [
    h('button', { class: 'knopf zweit', on: { click: () => exportieren() } }, 'Als Datei sichern'),
    h('button', { class: 'knopf rot', on: { click: () => { projektAktiv(id(), neuesProjekt()); verlauf.stand = null; sichern(); stapel = [{ s: 'start' }]; s(); } } }, 'Neu beginnen')]);
}
</script>
