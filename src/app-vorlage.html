<!-- Stromlaufplan · Fassung /*FASSUNG*/ · Stand 24.10.2026
     Etappe 3: Datenmodell und Eingabe.
       - Projekt mit mehreren Verteilern; ein Unterverteiler wird aus einem
         Abgang eines anderen Verteilers gespeist
       - je Verteiler: Einspeisung (Netzform, Leiter), Vorsicherung, Zähler,
         Hauptschalter, Überspannungsschutz, Abgangsbaum aus Gruppen (z. B. FI
         mit Untersammelschiene) und Abgängen
       - automatisch und überschreibbar: Kennzeichen nach DIN EN IEC 81346
         (-Q Hauptschalter, -F Schutzorgane, -P Zähler, -X Klemmen,
         -XD Steckdosen, -W Leitungen), Klemmennummern, Phasenverteilung
       - Planansicht vorerst als Liste; Zeichnen kommt mit Etappe 4
     v1.8: Namensnennung der QElectroTech-Schaltzeichen (CC BY 3.0) auf dem Startbildschirm
           und auf dem Deckblatt des Plans
     v1.7: Schaltgeräte je Abgang (Schütz, Stromstoßschalter, Zeitrelais) mit Kennzeichen -Q bzw. -K,
           N mitschalten, Ausstattung an Hilfskontakten; Hauptkontakte im Stromlaufplan,
           Schützzeichen im Übersichtsschaltplan, Herkunft im Klemmenplan, Zusatz im Türzettel
     v1.6: Bibliothek v1.4 mit den Zeichen für Steuerstromkreise (noch ohne Verwendung im Plan)
     v1.5: Klemmenplan der Klemmleiste -X1 je Verteiler (Tabelle mit Aderfarben br/sw/gr/bl/gnge)
           hinter den Stromlaufplänen, abschaltbar; N-Klemme je Verteiler wählbar
           (N-Trennklemme oder normale N-Klemme), auch im Stromlaufplan gezeichnet
     v1.4: Endklemmen (Geräteanschlussdose) und offene Enden schließen genau mit der
           Unterkante der Steckdosen ab, im Stromlaufplan und im Übersichtsschaltplan
     v1.3: Übersichtsschaltplan (einpolig) je Verteiler hinter dem Inhaltsverzeichnis,
           abschaltbar in den Projektdaten; einpolige Zeichen aus der Bibliothek v1.3
     v1.2: Deckblatt (Blatt 1) und Inhaltsverzeichnis (Blatt 2) vor den Planblättern,
           abschaltbar in den Projektdaten; Planblätter beginnen dann mit Blatt 3
     v1.1: Türzettel (Sicherungsübersicht) je Verteiler, A4 hoch, zum Ausdrucken
     v1.0: alle Linien in Leiterstärke (auch Sammelschienen und deren Querverweise);
           Verbindungspunkte überall, wo drei oder mehr Linien zusammentreffen
     v0.9: Untersammelschienen in Leiterstärke (0,25 mm); nur die Hauptsammelschienen bleiben 0,5 mm
     v0.8: Endklemmen der Anschlussdose auf Höhe der übrigen Abgangsenden
     v0.7: Anschluss auch als Geräteanschlussdose (Endklemmen, -X2 …) und als
           Leuchte (Lampenzeichen, -E1 …); Bibliothek v1.2
     v0.6: alle Abgänge enden ganz unten auf einer Höhe; Überspannungsschutz:
           PE-Seite der Ableiter grün
     v0.5: Schriftfeld als 20 mm hoher Streifen über die ganze Blattbreite
     v0.4: Plan: keine Leiter mehr übereinander in Gruppen (N/PE werden rechts
           neben dem Gruppengerät zugeführt), Untersammelschienen nur von der
           ersten bis zur letzten Verbindung, Abgänge einer Reihe enden auf
           gleicher Höhe (auch feste Anschlüsse)
     v0.3: Etappe 4a – Generator: Bildschirm „Plan“ mit allen Blättern, Format A4/A3
           (A4 voreingestellt), Druck/PDF aller Blätter; Einspeisungsblatt bzw.
           kurze Einspeisung auf dem ersten Abgangsblatt, Abgänge, Gruppen mit
           Untersammelschiene, Querverweise, Blattnummern durchgehend
     v0.2: Abgangsklemmen je Verteiler wählbar (Klemmleiste / ohne, neu: ohne),
           je Abgang als Option abweichend (mit / ohne Klemmen)
     Bedienung wie im SF E-Plan: eigene Bildschirme, ein Feld je Fenster,
     sofort gespeichert, Zurück-Pfeil genügt.
     Gerätekennungen = Kennungen der Bibliothek v1.1. -->
<style>

<script>
'use strict';
const FASSUNG = '/*FASSUNG*/';
const SPEICHER = 'slp.projekt.v1';

// ---------------------------------------------------------------------------
// Gerätearten (Kennungen = Bibliothek v1.1)
// pole: Zahl der Außenleiter, die das Gerät schaltet (1 oder 3); n: N mitgeführt
const GERAETE = {
  ls1:            { name: 'LS 1-polig',            pole: 1, kennlinie: true },
  ls3:            { name: 'LS 3-polig',            pole: 3, kennlinie: true },
  fils1n:         { name: 'FI/LS 1P+N',            pole: 1, kennlinie: true, fi: true },
  fils3n:         { name: 'FI/LS 3P+N',            pole: 3, kennlinie: true, fi: true },
  sich1:          { name: 'Sicherung 1-polig',     pole: 1, sicherung: true },
  sich3:          { name: 'Drei Sicherungen',      pole: 3, sicherung: true },
  fi2:            { name: 'FI 2-polig',            pole: 1, fi: true, ohneKennlinie: true },
  fi4:            { name: 'FI 4-polig',            pole: 3, fi: true, ohneKennlinie: true },
  sichtrenn3:     { name: 'Sicherungstrennschalter 3-polig', pole: 3, sicherung: true },
  sichlasttrenn3: { name: 'Sicherungslasttrennschalter 3-polig (NH)', pole: 3, sicherung: true },
  lasttrenn3:     { name: 'Lasttrennschalter 3-polig', pole: 3 },
  trenn3:         { name: 'Trennschalter 3-polig', pole: 3 },
  leistung3:      { name: 'Leistungsschalter 3-polig', pole: 3 },
  zaehler3:       { name: 'Zähler 3-phasig',       pole: 3, ohneNenn: true },
  zaehler1:       { name: 'Zähler 1-phasig',       pole: 1, ohneNenn: true },
  spd4:           { name: 'Überspannungsschutz 3/N', pole: 3, ohneNenn: true },
  spd2:           { name: 'Überspannungsschutz 1/N', pole: 1, ohneNenn: true },
};
const WAHL = {
  abgang:       ['ls1', 'ls3', 'fils1n', 'fils3n', 'sich1', 'sich3', ''],
  gruppe:       ['fi2', 'fi4', 'ls3', 'sich3', 'sichtrenn3'],
  vorsicherung: ['', 'sichlasttrenn3', 'sichtrenn3', 'sich3', 'ls3'],
  hauptschalter:['', 'lasttrenn3', 'trenn3', 'leistung3'],
  zaehler:      ['', 'zaehler3', 'zaehler1'],
  spd:          ['', 'spd4', 'spd2'],
};
const gName = k => k ? GERAETE[k].name : 'ohne';
const KENNLINIEN = ['B', 'C', 'D', 'K', 'Z'];
const NENNSTROM = ['6', '10', '13', '16', '20', '25', '32', '40', '50', '63', '80', '100', '125', '160', '200', '250', '315', '400'];
const NENNFEHLER = ['10', '30', '100', '300', '500'];
const FI_TYP = ['A', 'F', 'B', 'B+', 'AC'];
const SICH_ART = ['gG', 'gL', 'aM'];
const ANSCHLUSS = { steckdose3: 'Steckdose 1/N/PE (Schuko, CEE 3-pol.)', steckdose5: 'Steckdose 3/N/PE (CEE 5-pol.)',
  dose: 'Geräteanschlussdose (Klemmen)', leuchte: 'Leuchte', fest: 'Fester Anschluss (offenes Ende)' };
const PHASEN = ['auto', 'L1', 'L2', 'L3'];
// Schaltgeräte im Abgang (Etappe B); Kennzeichen nach DIN EN IEC 81346-2: -Q schaltet Energie, -K Zeitrelais
const SCHALT = { schuetz: 'Schütz', stromstoss: 'Stromstoßschalter', zeitrelais: 'Zeitrelais' };
const ZR_FKT = { aus: 'ausschaltverzögert', ein: 'einschaltverzögert', einaus: 'ein- und ausschaltverzögert' };
const neuesSchalt = typ => ({ typ, nMit: false, hs: typ === 'zeitrelais' ? 0 : 1, ho: 0, zr: { fkt: 'aus', zeit: '3 min' } });

// ---------------------------------------------------------------------------
// Datenhaltung
const id = () => Math.random().toString(36).slice(2, 9);
function neuesProjekt() {
  return { format: 'slp-projekt', version: 1, projekt: { titel: 'Stromlaufplan', datum: new Date().toISOString().slice(0, 10), rev: '0', format: 'A4' }, verteiler: [] };
}
function neuerVerteiler(name) {
  return { id: id(), name, netzform: 'TN-S', leiter: '3NPE', klemmen: 'ohne',
    vorsicherung: { zeichen: '' }, zaehler: { zeichen: '' }, hauptschalter: { zeichen: 'lasttrenn3', nenn: '63' }, spd: { zeichen: '' },
    knoten: [] };
}
function neuerAbgang() {
  return { id: id(), typ: 'abgang', geraet: { zeichen: 'ls1', kennlinie: 'B', nenn: '16' }, phase: 'auto',
    leitung: { typ: 'NYM-J', quer: '2,5' }, ziel: { bez: '', ort: '', anschluss: 'steckdose3' }, speist: null, klemmen: 'verteiler' };
}
function neueGruppe() {
  return { id: id(), typ: 'gruppe', geraet: { zeichen: 'fi4', nenn: '40', idn: '30', fityp: 'A' }, kinder: [] };
}
let P;
try { P = JSON.parse(localStorage.getItem(SPEICHER)); } catch (e) { P = null; }
if (!P || P.format !== 'slp-projekt') P = neuesProjekt();
function sichern() { try { localStorage.setItem(SPEICHER, JSON.stringify(P)); } catch (e) { meldung('Speichern im Gerät nicht möglich'); } }

// Hilfen im Baum
const vById = vid => P.verteiler.find(v => v.id === vid);
function alleKnoten(v, f, liste = v.knoten, eltern = null, tiefe = 0) {
  liste.forEach((k, i) => { f(k, eltern, liste, i, tiefe); if (k.typ === 'gruppe') alleKnoten(v, f, k.kinder, k, tiefe + 1); });
}
function knoten(v, kid) { let r = null; alleKnoten(v, (k, e, l, i) => { if (k.id === kid) r = { k, eltern: e, liste: l, i }; }); return r; }
// welcher Abgang speist diesen Verteiler?
function speisenderAbgang(vid) {
  for (const v of P.verteiler) { let r = null; alleKnoten(v, k => { if (k.typ === 'abgang' && k.speist === vid) r = { v, k }; }); if (r) return r; }
  return null;
}

// ---------------------------------------------------------------------------
// Berechnung: Kennzeichen, Klemmen, Phasen (automatisch, überschreibbar)
function istDrei(k, v) {
  if (v.leiter === '1NPE') return false;
  const g = k.geraet.zeichen;
  if (g && GERAETE[g].pole === 3) return true;
  if (k.ziel && k.ziel.anschluss === 'steckdose5') return true;
  if (k.speist) { const u = vById(k.speist); if (u && u.leiter === '3NPE') return true; }
  return false;
}
function berechne(v) {
  const z = { F: 0, Q: 0, K: 0, P: 0, W: 0, XD: 0, X: 1, E: 0 };   // X: -X1 ist die Klemmleiste im Verteiler, Anschlussdosen ab -X2
  const bmk = (art, hand) => { z[art]++; return hand ? { t: hand, hand: true } : { t: `-${art}${z[art]}`, hand: false }; };
  const e = { geraete: {}, abgaenge: {}, kopf: {} };
  // Einspeisung von oben nach unten
  if (v.vorsicherung.zeichen) e.kopf.vorsicherung = bmk('F', v.vorsicherung.bmk);
  if (v.zaehler.zeichen) e.kopf.zaehler = bmk('P', v.zaehler.bmk);
  if (v.hauptschalter.zeichen) e.kopf.hauptschalter = bmk('Q', v.hauptschalter.bmk);
  if (v.spd.zeichen) e.kopf.spd = bmk('F', v.spd.bmk);
  // Phasenlast: zählt einphasige Abgänge je Außenleiter
  const last = { L1: 0, L2: 0, L3: 0 };
  let klemme = 0;
  // Gruppe mit 1-poligem Gerät (FI 2-polig) im Drehstromverteiler: alle ihre
  // Abgänge hängen an deren einem Außenleiter
  const einLeiterGruppe = g => g && g.typ === 'gruppe' && v.leiter === '3NPE' && GERAETE[g.geraet.zeichen] && GERAETE[g.geraet.zeichen].pole === 1;
  e.gruppenPhase = {};
  alleKnoten(v, (k, eltern) => {
    if (k.typ === 'gruppe') { e.geraete[k.id] = bmk('F', k.geraet.bmk); return; }
    const a = {};
    if (k.geraet.zeichen) a.f = bmk('F', k.geraet.bmk);
    a.drei = istDrei(k, v);
    if (a.drei) a.phase = { t: 'L1–L3', auto: false };
    else if (v.leiter === '1NPE') a.phase = { t: 'L', auto: false };
    else if (einLeiterGruppe(eltern)) a.phase = { t: null, auto: false, gruppe: eltern.id };
    else if (k.phase && k.phase !== 'auto') { a.phase = { t: k.phase, auto: false }; last[k.phase]++; }
    else a.phase = { t: null, auto: true };
    a.leiter = a.drei ? ['L1', 'L2', 'L3', 'N', 'PE'] : ['L', 'N', 'PE'];

      const n = k.kinder.filter(c => c.typ === 'abgang').length;
      zeileT('gruppe', e.geraete[k.id].t, `${gName(k.geraet.zeichen)} ${bemessung(k.geraet)}`, e.gruppenPhase[k.id] ? e.gruppenPhase[k.id].t : '',
        `schützt ${n} Stromkreis${n === 1 ? '' : 'e'}`, '', '');
      return;
    }
    const a = e.abgaenge[k.id];
    zeileT(tiefe ? 'ein' : '', a.f ? a.f.t : '—', k.geraet.zeichen ? `${gName(k.geraet.zeichen)} ${bemessung(k.geraet)}` : 'ohne Schutzorgan',
      a.phase.t, zielText(k, a) + (a.schalt ? ` (über ${a.schalt.bmk.t} ${SCHALT[a.schalt.typ]})` : ''), k.ziel.ort, `${a.w.t} ${leitungText(k, a)}`);
  });
  const herkunft = sp ? `gespeist aus ${sp.v.name}${(berechne(sp.v).abgaenge[sp.k.id].f || {}).t ? ' ' + berechne(sp.v).abgaenge[sp.k.id].f.t : ''}`
                      : `Einspeisung ${v.netzform}, ${v.leiter === '3NPE' ? '3/N/PE' : '1/N/PE'}`;
  return h('section', { class: 'tz' },
    h('h1', {}, v.name),
    h('div', { class: 'tzu' }, [P.projekt.projekt, herkunft].filter(Boolean).join(' · ')),
    h('table', {}, h('thead', {}, h('tr', {}, ['Kennz.', 'Schutzorgan', 'Leiter', 'Stromkreis', 'Ort', 'Leitung'].map(t => h('th', {}, t)))), tb),
    h('div', { class: 'fuss' }, [P.projekt.firma, `Stand ${datumDE(P.projekt.datum)}`, P.projekt.nummer ? `Zeichnung ${P.projekt.nummer}` : '', P.projekt.rev ? `Rev. ${P.projekt.rev}` : '']
      .filter(Boolean).join(' · ')));
}
function bTuer(b) {
  const liste = b.vid ? [vById(b.vid)] : P.verteiler;
  app.append(kopf('Türzettel', h('button', { class: 'kopfknopf', on: { click: () => tuerDrucken(liste) } }, 'Drucken')));
  const m = h('main');
  m.append(h('p', { class: 'hinweis' }, 'Sicherungsübersicht für die Verteilertür, A4 hoch. Beim Drucken auf Skalierung 100 % achten.'));
  liste.forEach(v => m.append(h('div', { class: 'tzwrap' }, tuerzettel(v))));
  app.append(m);
}
function tuerDrucken(liste) {
  const d = document.getElementById('druck'); d.innerHTML = '';
  liste.forEach(v => d.append(tuerzettel(v)));
  document.getElementById('seite').textContent = '@page{size:A4 portrait;margin:14mm 12mm}';
  setTimeout(() => window.print(), 60);
}

// ---- Stand hinaus und herein ----------------------------------------------
function dateiname() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const name = (P.projekt.projekt || 'Projekt').replace(/[\\/:*?"<>|]+/g, ' ').trim();
  return `${String(d.getFullYear()).slice(2)}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${name}.slp.json`;
}
async function exportieren() {
  const text = JSON.stringify(P, null, 1), name = dateiname();
  const datei = new File([text], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [datei] })) {
    try { await navigator.share({ files: [datei], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = h('a', { href: URL.createObjectURL(datei), download: name }); document.body.append(a); a.click(); a.remove();
}
document.getElementById('datei').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.format !== 'slp-projekt') throw new Error('keine Stromlaufplan-Datei');
    frage('Projekt öffnen', `„${d.projekt.projekt || f.name}“ ersetzt das Projekt auf diesem Gerät.`, () => { P = d; stapel = [{ s: 'start' }]; }, 'Öffnen');
  } catch (e) { meldung('Datei nicht lesbar: ' + e.message); }
});

function meldung(t) { const m = document.getElementById('meldung'); m.textContent = t; m.classList.add('an'); clearTimeout(meldung.t); meldung.t = setTimeout(() => m.classList.remove('an'), 2200); }
function fehler(t) { const f = document.getElementById('fehlerband'); f.textContent = 'Fehler: ' + t; f.style.display = 'block'; }
window.addEventListener('error', e => fehler(e.message));
window.addEventListener('unhandledrejection', e => fehler(e.reason && e.reason.message || String(e.reason)));
document.addEventListener('gesturestart', e => e.preventDefault());
zeichne();
</script>
